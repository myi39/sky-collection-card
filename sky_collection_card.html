<style>
  @font-face {
    font-family: 'Papyrus';
    src: url('fonts/PAPYRUS.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* 表画像の比率に固定（1226:1750 → 縦/横 = 1.4274）。
       高さ予算(56vh)は幅側に変換して効かせ、アスペクトを常に一定に保つ
       （ビューポート高さ＝ブラウザ差で比率が変わるのを防ぐ）。 */
    --card-ar: 1.4274;
    --card-w: min(clamp(240px, 78vw, 340px), calc(56vh / 1.4274));
    --card-h: calc(var(--card-w) * 1.4274);
  }

  html, body {
    background: #080810;
    min-height: 100%;
  }

  .site-frame {
    width: 100%;
    min-height: 100dvh;
    background: #080810;
    border-radius: var(--border-radius-lg);
    overflow: hidden;
    position: relative;
    color: #fff;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  .sky-bg { position: absolute; inset: 0; background: #080810; overflow: hidden; }
  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:0.3} 50%{opacity:0.9} }

  .nav {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 0.5px solid rgba(255,255,255,0.07);
  }

  .nav-logo {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
  }


  .carousel-wrap {
    position: relative;
    z-index: 5;
    padding: 0;
    overflow: hidden;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .carousel-track {
    display: flex;
    align-items: center;
    gap: 16px;
    will-change: transform;
    transition: transform 0.5s cubic-bezier(0.25,0.1,0.25,1);
    cursor: grab;
    user-select: none;
    padding: 30px 0;
    width: 100%;
  }

  .card-slot {
    flex: 0 0 auto;
    transition: transform 0.5s cubic-bezier(0.25,0.1,0.25,1), opacity 0.5s;
    perspective: 900px;
  }

  .card-slot.center { transform: scale(1.0); opacity: 1; z-index: 10; }
  .card-slot.side-1 { transform: scale(0.88); opacity: 0.7; }
  .card-slot.side-2 { transform: scale(0.75); opacity: 0.3; }
  .card-slot.side-3 { transform: scale(0.60); opacity: 0.08; }

  .card-inner {
    width: var(--card-w);
    height: var(--card-h);
    position: relative;
    transform-style: preserve-3d;
    border-radius: 11px;
    cursor: pointer;
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 11px;
    backface-visibility: hidden;
    overflow: hidden;
    border: 0.5px solid rgba(255,255,255,0.1);
  }

  .card-back {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    gap: 6px;
  }

  .card-sky { position: absolute; inset: 0; }

  .card-front-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;        /* 表：全体表示（フルサイズ・切り取りなし） */
  }
  /* 裏：高さを基準に満たし、横は中央で見切れる（表と同じ枠サイズ） */
  .card-back .card-front-img {
    object-fit: cover;
    object-position: center;
  }

  .card-silhouette {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: calc(var(--card-w) * 0.61);
    height: calc(var(--card-h) * 0.6);
  }

  .card-num {
    position: absolute;
    top: 9px;
    left: 11px;
    font-size: 22px;
    font-weight: 500;
    color: rgba(255,255,255,0.15);
    letter-spacing: -0.02em;
  }

  .card-name-front {
    position: absolute;
    bottom: 11px;
    left: 0; right: 0;
    text-align: center;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.7);
  }

  .back-emoji { font-size: 22px; margin-bottom: 2px; }
  .back-name { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.88); letter-spacing: 0.04em; text-align: center; }
  .back-stat { font-size: 9px; color: rgba(255,255,255,0.38); letter-spacing: 0.04em; text-align: center; line-height: 1.6; }

  .info-panel {
    position: relative;
    z-index: 5;
    max-width: 380px;
    margin: 14px auto 0;
    text-align: center;
    padding: 0 20px 10px;
    min-height: 80px;
  }

  .info-name { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: -0.01em; margin-bottom: 6px; font-family: Papyrus, fantasy; }
  .info-desc { font-size: 13px; color: rgba(255,255,255,0.36); letter-spacing: 0.02em; line-height: 1.65; font-family: Papyrus, fantasy; }

  .bgm-btn {
    position: fixed;
    bottom: 18px;
    left: 18px;
    z-index: 200;
    background: rgba(255,255,255,0.05);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 5px 11px;
    color: rgba(255,255,255,0.28);
    font-size: 10px;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, opacity 0.3s;
    user-select: none;
  }
  .bgm-btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.55); }

  .flip-hint { font-size: 11px; color: rgba(255,255,255,0.16); letter-spacing: 0.08em; text-align: center; margin: 12px 0 4px; position: relative; z-index: 5; }

  .nav-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding: 16px 0 22px;
    position: relative;
    z-index: 5;
    touch-action: none;
  }

  .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.14); cursor: pointer; transition: all 0.3s; }
  .dot.active { background: rgba(255,255,255,0.65); width: 15px; border-radius: 3px; }
  @keyframes dot-pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.6); }  /* 弾みの強さ（調整可） */
    100% { transform: scale(1); }
  }
  .dot.pop { animation: dot-pop 120ms ease-out; }  /* 弾みの速さ（調整可） */

  .footer-line {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 14px 20px 22px;
    border-top: 0.5px solid rgba(255,255,255,0.05);
    font-size: 11px;
    color: rgba(255,255,255,0.14);
    letter-spacing: 0.07em;
  }

  @media (max-width: 480px) {
    .nav { padding: 14px 16px; }

    .carousel-wrap { padding: 0; }

    .info-panel { margin: 10px auto 0; }
    .info-name { font-size: 17px; }
    .info-desc { font-size: 12px; }
  }

.carousel-wrap { position: relative; } /* overlay の位置基準に */

.ghost-slot {
  flex: 0 0 auto;
  width: var(--card-w);
  height: var(--card-h);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.5s cubic-bezier(0.25,0.1,0.25,1), opacity 0.5s;
  perspective: 900px;
  cursor: pointer;
}

.ghost-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
.ghost-hint.visible { opacity: 1; }

.hint-label {
  font-size: 13px;
  letter-spacing: 0.14em;
  color: rgba(255, 228, 100, 0.55);
  font-family: serif;
  font-style: italic;
}

.hint-arrow {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255, 215, 80, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255, 222, 90, 0.58);
  font-size: 14px;
  animation: hint-pulse 2.8s ease-in-out infinite;
}

@keyframes hint-pulse {
  0%, 100% { box-shadow: 0 0 5px rgba(255, 200, 60, 0.10); }
  50%       { box-shadow: 0 0 13px rgba(255, 200, 60, 0.24); }
}

@keyframes card-spin {
  0%   { transform: rotateY(0deg); animation-timing-function: linear; }
  85%  { transform: rotateY(918deg); animation-timing-function: ease-out; }
  100% { transform: rotateY(1080deg); }
}


/* ─── Plan B: 3D button above card slot ──────────────── */
.card-slot { position: relative; }
.btn-3d {
  position: absolute;
  top: -26px;
  right: 0;
  z-index: 20;
  background: transparent;
  border: none;
  border-bottom: 0.5px solid rgba(255,255,255,0.25);
  border-radius: 0;
  padding: 2px 2px 3px;
  font-size: 9px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.1em;
  cursor: pointer;
  display: none;
  transition: color 0.2s, border-color 0.2s;
  font-family: inherit;
  white-space: nowrap;
}
.btn-3d:hover { color: rgba(255,255,255,0.85); border-bottom-color: rgba(255,255,255,0.6); }

/* ─── Plan B: modal ──────────────────────────────────── */
#modal-3d {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(4,4,16,0.96);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#modal-3d.open { display: flex; }
#modal-3d-wrap {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  border-radius: 11px;
  overflow: hidden;
  border: 0.5px solid rgba(255,255,255,0.12);
}
#modal-3d-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}
#modal-3d-canvas {
  position: relative;
  width: 100%;
  height: 100%;
  display: block;
}
#modal-3d-reset {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 5;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.22);
  color: rgba(255,255,255,0.6);
  font-size: 12px;
  cursor: pointer;
  line-height: 1;
  padding: 0;
  display: none;
}
.modal-3d-name {
  margin-top: 18px;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.1em;
  font-family: Papyrus, fantasy;
}
.modal-3d-close {
  position: absolute;
  top: 20px;
  right: 24px;
  font-size: 22px;
  color: rgba(255,255,255,0.28);
  cursor: pointer;
  background: none;
  border: none;
  line-height: 1;
  padding: 4px;
  transition: color 0.2s;
  font-family: inherit;
}
.modal-3d-close:hover { color: rgba(255,255,255,0.7); }
@keyframes planAResetAppear {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}
.planA-reset-show {
  animation: planAResetAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  pointer-events: auto !important;
}
</style>

let motionActive = false;   // スクラブ/フリック中 = true（この間は画像を読み込まない）

const carousel = document.getElementById("carousel");
const navDots = document.getElementById("navDots");
let pendingPop = false; // 次の buildDots で active ドットを弾ませる
const infoName = document.getElementById("infoName");
const infoDesc = document.getElementById("infoDesc");

function buildStars() {
  const c = document.getElementById("stars");
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const sz = Math.random() > 0.88 ? 2.5 : 1.5;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*65}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    c.appendChild(s);
  }
}

const silSVG = (idx) => idx % 2 === 0
  ? `<svg viewBox="0 0 80 110" fill="none" xmlns="http://www.w3.org/2000/svg" class="card-silhouette"><ellipse cx="40" cy="17" rx="9" ry="9" fill="rgba(255,255,255,0.17)"/><path d="M29 33 Q40 27 51 33 L55 68 L43 66 L40 88 L37 66 L25 68 Z" fill="rgba(255,255,255,0.14)"/><path d="M29 33 L17 58 L25 61 L31 44" fill="rgba(255,255,255,0.11)"/><path d="M51 33 L63 58 L55 61 L49 44" fill="rgba(255,255,255,0.11)"/><path d="M37 88 L34 110 L39 110 L40 94" fill="rgba(255,255,255,0.12)"/><path d="M43 88 L46 110 L41 110 L40 94" fill="rgba(255,255,255,0.12)"/></svg>`
  : `<svg viewBox="0 0 80 110" fill="none" xmlns="http://www.w3.org/2000/svg" class="card-silhouette"><ellipse cx="40" cy="17" rx="9" ry="9" fill="rgba(255,255,255,0.17)"/><path d="M31 31 Q40 25 49 31 L53 64 L41 62 L40 86 L39 62 L27 64 Z" fill="rgba(255,255,255,0.14)"/><path d="M31 31 L14 54 L22 57 L30 41" fill="rgba(255,255,255,0.11)"/><path d="M49 31 L66 54 L58 57 L50 41" fill="rgba(255,255,255,0.11)"/><path d="M39 86 L36 110 L40 110" fill="rgba(255,255,255,0.12)"/><path d="M41 86 L44 110 L40 110" fill="rgba(255,255,255,0.12)"/></svg>`;

function buildCard(p, idx) {
  const slot = document.createElement("div");
  slot.className = "card-slot";
  const [c1, c2] = GRADIENTS[idx % GRADIENTS.length];

  slot.innerHTML = `
    <button class="btn-3d" data-idx="${idx}">3D で見る ›</button>
    <div class="card-inner" id="ci-${idx}">
      <div class="card-face">
        <img data-src="${p.frontImg}" data-hi-src="${p.frontImg.replace('card_front/','card_front_hi/')}" class="card-front-img" alt="${p.name}" draggable="false" decoding="async">
      </div>
      <div class="card-face card-back" style="padding:0">
        <img data-back-src="${p.backImg}" class="card-front-img" alt="${p.name}" draggable="false" decoding="async">
      </div>
    </div>`;

  slot.querySelector(".card-inner").addEventListener("click", () => {
    if (modalInteractionBlock || document.getElementById('modal-3d').classList.contains('open')) return;
    if (didDrag || didTouchDrag || touchHandled) return;
    if (!slot.classList.contains("center")) {
      navigateTo(idx);
    } else {
      doFlip(idx);
    }
  });
  slot.querySelector(".btn-3d").addEventListener("click", e => {
    e.stopPropagation();
    openModal3d(idx);
  });
  return slot;
}

function buildDots() {
  const needed = (current === SPECIAL_IDX && !revealDone)
    ? 0
    : (revealDone ? players.length + 1 : players.length);

  // 動作中で個数が変わらなければ、再生成せず active クラスだけ移す（DOM churn 回避）
  if (motionActive && navDots.children.length === needed && needed > 0) {
    for (let i = 0; i < needed; i++) {
      navDots.children[i].classList.toggle("active", i === current);
    }
    return;
  }

  navDots.innerHTML = "";
  if (needed === 0) return; // reveal前はdots非表示
  for (let i = 0; i < needed; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i === current ? " active" : "");
    if (i === current && pendingPop) d.classList.add("pop");
    navDots.appendChild(d);
  }
  pendingPop = false;
}

function getClass(i) {
  const d = Math.abs(i - current);
  return d === 0 ? "center" : d === 1 ? "side-1" : d === 2 ? "side-2" : "side-3";
}

// カード1枚の等倍レイアウト幅（小数）を返す。
// offsetWidth は整数に丸められ、× current で後ろのカードほど累積ズレを生む。
// getComputedStyle は scale(transform) の影響を受けず小数px を返すのでズレが出ない。
function cardInnerWidth() {
  const cardEl = carousel.querySelector(".card-inner");
  if (!cardEl) return 240;
  return parseFloat(getComputedStyle(cardEl).width) || 240;
}

function adjustTranslate() {
  const W = carousel.parentElement.offsetWidth;
  const cardW = cardInnerWidth();
  const gap = 16;
  const cw = cardW + gap;
  const offset = W / 2 - current * cw - cardW / 2;
  carousel.style.transform = `translateX(${offset}px)`;
}

const cardDeg = {};
let didDrag = false, didTouchDrag = false, touchHandled = false;
let carouselDragActive = false;
let carouselDragPending = false;

function isUIElement(el) {
  return !!el.closest('nav, .footer-line, button, select, a, .nav-dots');
}
let liveOffset = 0, rafId = null;

function doFlip(idx) {
  const ci = document.getElementById(`ci-${idx}`);
  if (!ci) return;
  const backImg = ci.querySelector('.card-back img[data-back-src]');
  const d = cardDeg[idx] || 0;
  const toBack = !flipped.has(idx);
  const base = Math.floor(d / 360) * 360;
  let target;
  if (toBack) {
    // 裏画像は重いのでフリップ時に読み込む（アニメ中にデコードが間に合う）
    if (backImg && backImg.getAttribute('src') !== backImg.dataset.backSrc) {
      backImg.src = backImg.dataset.backSrc;
    }
    // 次の ≡180(mod360) の位置 + 2スピン
    target = (base + 180 > d ? base + 180 : base + 540) + 720;
    flipped.add(idx);
  } else {
    // 次の ≡0(mod360) の位置 + 2スピン
    target = base + 360 + 720;
    flipped.delete(idx);
    // 表に戻したらメモリ節約のため裏画像を解放（アニメ完了後）
    if (backImg) setTimeout(() => { if (!flipped.has(idx)) backImg.removeAttribute('src'); }, 900);
  }
  cardDeg[idx] = target;
  ci.style.transition = "transform 0.85s cubic-bezier(0.16, 1, 0.3, 1)";
  ci.style.transform = `rotateY(${target}deg)`;
  setTimeout(() => { ci.style.transition = ""; }, 850);
}

function getBaseOffset(idx) {
  const W = carousel.parentElement.offsetWidth;
  const cardW = cardInnerWidth();
  return W / 2 - idx * (cardW + 16) - cardW / 2;
}

function nearestCard(offset) {
  const W = carousel.parentElement.offsetWidth;
  const cardW = cardInnerWidth();
  const cw = cardW + 16;
  return Math.max(0, Math.min(players.length, Math.round((W / 2 - cardW / 2 - offset) / cw)));
}

function cancelInertia() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  motionActive = false;
}

function updateHighlight(offset) {
  const nearest = nearestCard(offset);
  if (nearest !== current) {
    current = nearest;
    carousel.querySelectorAll(".card-slot").forEach((s, i) => {
      s.className = "card-slot " + getClass(i);
    });
    applyCardVisibility();
    if (current === SPECIAL_IDX && !revealDone) triggerReveal();
  }
}

function startInertia(velPxPerMs) {
  cancelInertia();
  motionActive = true;        // 慣性スクロール中：画像読み込みを止める
  carousel.style.transition = "none";
  let vel = velPxPerMs * 16; // px/ms → px/frame (60fps)
  let offset = liveOffset;
  const minOff = getBaseOffset(players.length);
  const maxOff = getBaseOffset(0);

  function frame() {
    vel *= 0.93; // 摩擦
    offset += vel;
    if (offset > maxOff) { offset = maxOff; vel = 0; }
    if (offset < minOff) { offset = minOff; vel = 0; }
    carousel.style.transform = `translateX(${offset}px)`;
    liveOffset = offset;
    updateHighlight(offset);
    if (Math.abs(vel) < 0.5) {
      const target = nearestCard(offset);
      current = target;
      carousel.style.transition = "transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1)";
      motionActive = false;     // 停止：ウィンドウ内の画像をまとめて読み込む
      render();
      loadNearImages();
      return;
    }
    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);
}

// 表画像は全カードを軽量解像度(480px)で常駐デコードする（仮想化なし）。
// → スクラブ中のデコードが起きず、どこでも即表示になる。
// 裏画像は重い(769px)ため、フリップ時のみ読み込む（doFlip 参照）。
function loadAllFronts() {
  const imgs = carousel.querySelectorAll('img[data-src]'); // 表画像のみ
  let i = 0;
  function step() {
    const t0 = performance.now();
    while (i < imgs.length && performance.now() - t0 < 6) { // 1フレーム最大6msだけ読む
      const img = imgs[i++];
      if (img.getAttribute('src') !== img.dataset.src) {
        img.src = img.dataset.src;
        if (img.decode) img.decode().catch(() => {}); // RAMへ先行デコード（visibility切替時に即描画）
      }
    }
    if (i < imgs.length) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// 表画像は常駐するので、移動時の画像管理は不要（呼び出し箇所互換のための空関数）
function updateCardImages() {}
function loadNearImages() {}

// GPU合成の負荷を抑える — 画面に映る範囲(±VISIBLE_WINDOW)だけ描画し、
// 遠いカードは visibility:hidden でGPUコンポジットから外す。
// 画像のデコード済みデータはRAMに残るため、近づけば再デコードなしで即描画される。
const VISIBLE_WINDOW = 2;
function applyCardVisibility() {
  const slots = carousel.children; // card-slot ×N + ghost-slot
  for (let i = 0; i < slots.length; i++) {
    slots[i].style.visibility =
      (Math.abs(i - current) <= VISIBLE_WINDOW) ? "visible" : "hidden";
  }
}

// 高画質で描くのは常に中央1枚だけ。停止時のみ中央を高画質へ、他は480pxへ戻す。
// （スクラブ/フリック中は重い高画質を読み込まない＝クラッシュ防止）
function applyCenterHiRes() {
  if (motionActive) return;
  const slots = carousel.children;
  for (let i = 0; i < slots.length; i++) {
    const img = slots[i].querySelector('img[data-src]'); // 表imgのみ（裏は data-back-src）
    if (!img) continue;
    if (i === current && img.dataset.hiSrc) {
      if (img.getAttribute('src') !== img.dataset.hiSrc) img.src = img.dataset.hiSrc;
    } else {
      if (img.getAttribute('src') !== img.dataset.src) img.src = img.dataset.src;
    }
  }
}

function render() {
  carousel.querySelectorAll(".card-slot").forEach((s, i) => {
    s.className = "card-slot " + getClass(i);
  });
  applyCardVisibility();
  applyCenterHiRes();
  adjustTranslate();

  // ゴーストスロットのスケール/透明度
  const gs = document.getElementById("ghost-slot");
  if (gs) {
    const d = Math.abs(SPECIAL_IDX - current);
    const scl = d === 0 ? 1.0 : d === 1 ? 0.88 : d === 2 ? 0.75 : 0.60;
    const opc = d === 0 ? 1   : d === 1 ? 0.7  : d === 2 ? 0.3  : 0.08;
    gs.style.transform = `scale(${scl})`;
    gs.style.opacity   = String(opc);
  }

  // ゴーストヒント — 最後のカードまたはゴーストスロット上で表示
  const hint = document.getElementById("ghost-hint");
  if (hint && !revealDone) {
    if (current >= players.length - 1) hint.classList.add("visible");
    else hint.classList.remove("visible");
  }

  if (current < players.length) {
    const p = players[current];
    infoName.textContent = p.name;
    infoDesc.textContent = p.desc;
  } else if (revealDone) {
    infoName.textContent = "&You";
    infoDesc.textContent = "Sample text";
  } else {
    infoName.textContent = "";
    infoDesc.textContent = "";
  }
  buildDots();
}

function navigateTo(idx) {
  if (idx === current) return;       // 同じカードなら何もしない
  if (!motionActive) {               // タップ移動のときだけ弾み＋振動
    pendingPop = true;
    if (navigator.vibrate) navigator.vibrate(10); // Android のみ反応・iOS は無視
  }
  current = idx;
  render();
}

// ─── Nav-dots スクラブ（iPhone ホーム画面風） ───────────────
let scrubbing = false;
let scrubFirstC = 0, scrubLastC = 0, scrubCount = 0;
let scrubTargetIdx = null, scrubRaf = null;

// pointermove の連打を 1フレーム1回に間引く（イベント頻度と実処理を分離）
function scheduleScrub() {
  if (scrubRaf !== null) return;
  scrubRaf = requestAnimationFrame(() => {
    scrubRaf = null;
    if (scrubTargetIdx !== null) navigateTo(scrubTargetIdx);
  });
}

function cacheScrubGeometry() {
  const dots = navDots.querySelectorAll('.dot');
  scrubCount = dots.length;
  if (scrubCount === 0) return;
  const firstR = dots[0].getBoundingClientRect();
  const lastR  = dots[scrubCount - 1].getBoundingClientRect();
  scrubFirstC = firstR.left + firstR.width / 2;
  scrubLastC  = lastR.left + lastR.width / 2;
}

function scrubIndexFromX(clientX) {
  if (scrubCount <= 1) return 0;
  const span = scrubLastC - scrubFirstC;
  const ratio = span === 0 ? 0 : (clientX - scrubFirstC) / span;
  const idx = Math.round(ratio * (scrubCount - 1));
  return Math.max(0, Math.min(scrubCount - 1, idx));
}

navDots.addEventListener('pointerdown', e => {
  if (current === SPECIAL_IDX && !revealDone) return; // reveal前はドット無し
  if (!navDots.querySelector('.dot')) return;
  e.preventDefault();
  e.stopPropagation();
  scrubbing = true;
  motionActive = true;              // 動作中：画像読み込みを止める
  navDots.setPointerCapture(e.pointerId);
  cacheScrubGeometry();
  scrubTargetIdx = scrubIndexFromX(e.clientX);
  scheduleScrub();
});

navDots.addEventListener('pointermove', e => {
  if (!scrubbing) return;
  e.preventDefault();
  scrubTargetIdx = scrubIndexFromX(e.clientX);
  scheduleScrub();
});

function endScrub(e) {
  if (!scrubbing) return;
  scrubbing = false;
  if (scrubRaf !== null) { cancelAnimationFrame(scrubRaf); scrubRaf = null; }
  if (scrubTargetIdx !== null) { navigateTo(scrubTargetIdx); scrubTargetIdx = null; }
  motionActive = false;             // 停止：ウィンドウ内の画像をまとめて読み込む
  loadNearImages();
  applyCenterHiRes();               // 停止した中央カードを高画質化
  try { navDots.releasePointerCapture(e.pointerId); } catch (_) {}
}
navDots.addEventListener('pointerup', endScrub);
navDots.addEventListener('pointercancel', endScrub);

function triggerReveal() {
  if (revealing || revealDone) return;
  revealing = true;
  cancelInertia();

  const infoPanelEl  = document.querySelector(".info-panel");
  const flipHintEl   = document.querySelector(".flip-hint");
  const overlay      = document.getElementById("special-card-overlay");
  const fall         = document.getElementById("special-card-fall");
  const drop         = document.getElementById("special-card-drop");

  // ─── Phase 1: コンテンツをフェードアウト（1.0s） ───
  [carousel, infoPanelEl, navDots, flipHintEl].forEach(el => {
    if (!el) return;
    el.style.transition = "opacity 1s ease";
    el.style.opacity    = "0";
  });

  setTimeout(() => {
    // ─── Phase 2: オーバーレイ表示・暗転（1s 待機） ───
    overlay.style.display = "flex";
    fall.getBoundingClientRect(); // force layout for offsetHeight
    const startY = -(overlay.offsetHeight / 2 + (drop.offsetHeight || 180) / 2 + 2);
    fall.style.transition = "none";
    fall.style.transform  = `translateY(${startY}px)`;
    drop.style.animation  = "none";
    drop.style.transform  = "rotateY(0deg)";
    fall.getBoundingClientRect(); // reflow

    setTimeout(() => {
      // ─── Phase 2b: 落下 + 回転アニメーション ───
      fall.style.transition = "transform 6s linear";
      fall.style.transform  = "translateY(0px)";
      drop.style.transform  = "";
      drop.style.animation  = "card-spin 8s forwards";

      setTimeout(() => {
        // ─── Phase 3: 静止（1.2s） ───

        setTimeout(() => {
          // ─── Phase 4: カルーセル復帰（0.8s） ───
          revealDone = true;

          // ゴーストスロットを特殊カードに切り替え
          document.getElementById("ghost-hint").style.display   = "none";
          document.getElementById(`ci-${SPECIAL_IDX}`).style.display = "block";

          // オーバーレイをフェードアウト
          overlay.style.transition = "opacity 0.6s ease";
          overlay.style.opacity    = "0";

          // カルーセルをぼんやり復帰
          carousel.style.visibility = "visible";
          [carousel, infoPanelEl, navDots, flipHintEl].forEach(el => {
            if (!el) return;
            el.style.transition = "opacity 0.8s ease";
            el.style.opacity    = "1";
          });

          render(); // 8つ目のdot・info-panel を更新

          setTimeout(() => {
            overlay.style.display  = "none";
            overlay.style.opacity  = "1"; // 次回用にリセット
            fall.style.transition  = "none";
            fall.style.transform   = `translateY(${startY}px)`;
            drop.style.animation   = "none";
            drop.style.transform   = "rotateY(0deg)";
            revealing = false;
          }, 800);

        }, 1200); // Phase 3
      }, 8000);   // Phase 2b
    }, 1000);     // 暗転待機
  }, 100);        // Phase 1
}

function init() {
  buildStars();
  players.forEach((p, i) => carousel.appendChild(buildCard(p, i)));
  carousel.style.cssText = "display:flex;align-items:center;padding:30px 0;";

  const ghostSlot = document.createElement("div");
  ghostSlot.className = "ghost-slot";
  ghostSlot.id = "ghost-slot";
  ghostSlot.innerHTML = `
  <div class="ghost-hint" id="ghost-hint">
    <span class="hint-label">and...</span>
    <div class="hint-arrow">▶</div>
  </div>
  <div class="card-inner" id="ci-${SPECIAL_IDX}"
       style="display:none;width:var(--card-w);height:var(--card-h);
              position:relative;transform-style:preserve-3d;border-radius:11px;cursor:pointer">
    <div class="card-face">
      <img data-src="images/card_front/00_%26you表.jpg" data-hi-src="images/card_front_hi/00_%26you表.jpg" class="card-front-img" alt="&You" draggable="false" decoding="async">
    </div>
    <div class="card-face card-back" style="transform:rotateY(180deg);padding:0">
      <img data-back-src="images/card_back/00_%26You裏.png" class="card-front-img" alt="&You" draggable="false" decoding="async">
    </div>
  </div>`;
  carousel.appendChild(ghostSlot);

  // ゴーストスロット — クリック（PC）
  ghostSlot.querySelector(".card-inner").addEventListener("click", () => {
    if (modalInteractionBlock || document.getElementById('modal-3d').classList.contains('open')) return;
    if (didDrag || touchHandled || !revealDone) return;
    if (current === SPECIAL_IDX) doFlip(SPECIAL_IDX);
  });

  current = 0;
  render();

  // マウスドラッグ（リアルタイム追従 + 慣性）
  let sx = 0, stime = 0, drag = false, baseOff = 0;
  document.addEventListener("mousedown", e => {
    if (isUIElement(e.target)) return;
    if (document.getElementById('modal-3d').classList.contains('open')) return;
    cancelInertia();
    drag = true; didDrag = false;
    sx = e.clientX; stime = Date.now();
    baseOff = liveOffset = getBaseOffset(current);
    carousel.style.transition = "none";
  });
  window.addEventListener("mousemove", e => {
    if (!drag) return;
    if (Math.abs(e.clientX - sx) > 5) didDrag = true;
    liveOffset = baseOff + e.clientX - sx;
    carousel.style.transform = `translateX(${liveOffset}px)`;
  });
  window.addEventListener("mouseup", e => {
    if (!drag) return;
    drag = false;
    startInertia((e.clientX - sx) / Math.max(1, Date.now() - stime));
  });

  // タッチスワイプ（リアルタイム追従 + 慣性 + 方向ロック）
  let tx = 0, ty = 0, ttime = 0, tbaseOff = 0;
  document.addEventListener("touchstart", e => {
    if (isUIElement(e.target)) return;
    if (document.getElementById('modal-3d').classList.contains('open')) return;
    carouselDragPending = true;
    carouselDragActive = false;
    cancelInertia();
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; ttime = Date.now();
    tbaseOff = liveOffset = getBaseOffset(current);
    didTouchDrag = false;
    carousel.style.transition = "none";
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!carouselDragPending && !carouselDragActive) return;
    const cx = e.touches[0].clientX;
    const cy = e.touches[0].clientY;
    const dx = Math.abs(cx - tx);
    const dy = Math.abs(cy - ty);
    if (carouselDragPending && (dx > 5 || dy > 5)) {
      carouselDragPending = false;
      if (dx >= dy) carouselDragActive = true;
    }
    if (!carouselDragActive) return;
    e.preventDefault();
    if (dx > 8) didTouchDrag = true;
    liveOffset = tbaseOff + cx - tx;
    carousel.style.transform = `translateX(${liveOffset}px)`;
  }, { passive: false });
  document.addEventListener("touchend", e => {
    const wasPending = carouselDragPending;
    const wasActive = carouselDragActive;
    carouselDragPending = false;
    carouselDragActive = false;
    if (!wasActive && !wasPending) return;
    if (modalInteractionBlock || document.getElementById('modal-3d').classList.contains('open')) return;
    if (e.target.closest('.btn-3d')) return;
    const endX = e.changedTouches[0].clientX;
    const dt = Date.now() - ttime;
    // タップ判定：移動なし & 短時間
    if (!didTouchDrag && dt < 250) {
      touchHandled = true;
      setTimeout(() => { touchHandled = false; }, 400);
      const cardSlot = e.target.closest(".card-slot");
      if (cardSlot) {
        const slots = [...carousel.querySelectorAll(".card-slot")];
        const idx = slots.indexOf(cardSlot);
        if (idx >= 0) {
          carousel.style.transition = "";
          if (cardSlot.classList.contains("center")) doFlip(idx);
          else navigateTo(idx);
          return;
        }
      } else {
        const ghostEl = e.target.closest(".ghost-slot");
        if (ghostEl && revealDone && current === SPECIAL_IDX) {
          carousel.style.transition = "";
          doFlip(SPECIAL_IDX);
          return;
        }
      }
    }
    startInertia((endX - tx) / Math.max(1, dt));
  }, { passive: true });

  window.addEventListener("resize", adjustTranslate);
}

init();
loadAllFronts(); // 表画像を全カード分、軽量解像度で常駐読み込み（progressive）

// BGM
(function() {
  const bgm = document.getElementById("bgm");
  const btn = document.getElementById("bgmBtn");
  bgm.volume = 0.28;
  bgm.muted = false;
  let playing = false;
  btn.textContent = "♪ ON";

  function startPlay() {
    if (playing) return;
    playing = true;
    bgm.play().catch(() => { playing = false; });
  }

  // 最初のユーザー操作から3秒後に再生（autoplay制限の回避）
  function onFirstInteraction() {
    document.removeEventListener("touchstart", onFirstInteraction);
    document.removeEventListener("mousedown", onFirstInteraction);
    setTimeout(startPlay, 1000);
  }
  document.addEventListener("touchstart", onFirstInteraction, { passive: true });
  document.addEventListener("mousedown", onFirstInteraction);

  // ボタンクリック：未再生なら開始、再生中はミュート切替
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!playing || bgm.paused) {
      startPlay();
      bgm.muted = false;
      btn.textContent = "♪ ON";
    } else {
      bgm.muted = !bgm.muted;
      btn.textContent = bgm.muted ? "♪ OFF" : "♪ ON";
    }
  });
})();

// ─── Three.js Lazy Loader ────────────────────────────────────
async function loadThree() {
  if (window._three) return window._three;
  return new Promise(resolve => {
    window.addEventListener('three-ready', () => resolve(window._three), { once: true });
  });
}

// ─── Plan B ──────────────────────────────────────────────────
let modalRenderer = null, modalControls = null, modalAnimId = null, modalScene = null;
let modal_camDist = 0, modal_hasMoved = false, modal_resetTimer = null;

async function openModal3d(idx) {
  closeModal3d();
  const p = (idx >= 0 && idx < players.length) ? players[idx] : { name: '&You', modelSrc: '3d/00_%26you.glb' };
  document.getElementById('modal3dName').textContent = p.name;

  // 3D ビューの背景画像（全カード共通）
  const bgImg = document.getElementById('modal-3d-bg');
  bgImg.src = CARD_3D_BG;
  bgImg.style.display = 'block';

  const modal = document.getElementById('modal-3d');
  modal.classList.add('open');

  const { THREE, GLTFLoader, OrbitControls } = await loadThree();
  const canvas = document.getElementById('modal-3d-canvas');

  // キャンバスの表示サイズを取得（CSS で決まる）
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 400;
  const h = rect.height || 400;

  const scene = new THREE.Scene();
  modalScene = scene;
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.01, 1000);

  scene.add(new THREE.AmbientLight(0xffffff, 1.2));
  const dir = new THREE.DirectionalLight(0xffffff, 1.8);
  dir.position.set(3, 5, 4);
  scene.add(dir);

  modalRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  modalRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  modalRenderer.setSize(w, h);
  modalRenderer.setClearColor(0x000000, 0);

  modalControls = new OrbitControls(camera, canvas);
  modalControls.enableDamping = true;
  modalControls.dampingFactor = 0.06;
  modalControls.enablePan = true;

  // リセットボタン
  const resetBtn = document.getElementById('modal-3d-reset');
  modal_hasMoved = false;
  modal_resetTimer = null;
  modalControls.addEventListener('start', () => {
    if (modal_hasMoved) return;
    modal_hasMoved = true;
    modal_resetTimer = setTimeout(() => {
      resetBtn.style.display = 'block';
      resetBtn.classList.remove('planA-reset-show');
      void resetBtn.offsetWidth;
      resetBtn.classList.add('planA-reset-show');
    }, 500);
  });
  resetBtn.onclick = () => {
    camera.position.set(0, 0, modal_camDist);
    camera.quaternion.set(0, 0, 0, 1);
    if (modalControls) { modalControls.target.set(0, 0, 0); modalControls.update(); }
    modal_hasMoved = false;
    clearTimeout(modal_resetTimer);
    resetBtn.style.display = 'none';
    resetBtn.classList.remove('planA-reset-show');
  };

  const loader = new GLTFLoader();
  loader.load(p.modelSrc, gltf => {
    // 新モデル（2026/06/21 差し替え）は正面を向いて出力されているため向き補正は不要
    // ライティングを掛けず、カード画像と同じ明るさでテクスチャをそのまま貼る（陰影なし）
    gltf.scene.traverse(o => {
      if (!o.isMesh || !o.material) return;
      const src = o.material;
      o.material = new THREE.MeshBasicMaterial({
        map: src.map || null,
        color: src.map ? 0xffffff : (src.color ? src.color.clone() : 0xffffff),
        transparent: src.transparent,
        alphaTest: src.alphaTest,
        side: src.side,
        vertexColors: src.vertexColors,
      });
    });
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    gltf.scene.position.sub(center);
    camera.position.set(0, 0, maxDim * 1.5);
    modal_camDist = maxDim * 1.5;
    modalControls.update();
    scene.add(gltf.scene);
  });

  function animate() {
    modalAnimId = requestAnimationFrame(animate);
    modalControls.update();
    modalRenderer.render(scene, camera);
  }
  animate();
}

function closeModal3d() {
  document.getElementById('modal-3d').classList.remove('open');
  if (modalAnimId) { cancelAnimationFrame(modalAnimId); modalAnimId = null; }
  // ジオメトリ・テクスチャを破棄してGPUメモリを解放
  if (modalScene) {
    modalScene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
          for (const k in m) { const v = m[k]; if (v && v.isTexture) v.dispose(); }
          m.dispose();
        });
      }
    });
    modalScene = null;
  }
  if (modalControls) { modalControls.dispose(); }
  if (modalRenderer) { modalRenderer.dispose(); modalRenderer = null; }
  modalControls = null;
  const resetBtn = document.getElementById('modal-3d-reset');
  if (resetBtn) { resetBtn.style.display = 'none'; resetBtn.classList.remove('planA-reset-show'); }
  clearTimeout(modal_resetTimer);
  modal_hasMoved = false;
  modalInteractionBlock = true;
  setTimeout(() => { modalInteractionBlock = false; }, 350);
}

// ─── Init (plan-b only) ───────────────────────────────────────
function showCardButtons() {
  document.querySelectorAll('.btn-3d').forEach(btn => {
    btn.style.display = 'block';
  });
}

// Modal close button and backdrop click
document.getElementById('modal3dClose').addEventListener('click', closeModal3d);
document.getElementById('modal-3d').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-3d')) closeModal3d();
});

showCardButtons();
</script>
