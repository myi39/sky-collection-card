
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .site-frame {
    width: 100%;
    min-height: 680px;
    background: #080810;
    border-radius: var(--border-radius-lg);
    overflow: hidden;
    position: relative;
    color: #fff;
    font-family: var(--font-sans);
  }

  .sky-bg { position: absolute; inset: 0; background: #080810; overflow: hidden; }
  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:0.3} 50%{opacity:0.9} }

  .nav {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 0.5px solid rgba(255,255,255,0.07);
  }

  .nav-logo {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
  }

  .nav-links { display: flex; gap: 24px; list-style: none; }
  .nav-links a { font-size: 12px; color: rgba(255,255,255,0.4); text-decoration: none; letter-spacing: 0.05em; }
  .nav-links a:hover { color: rgba(255,255,255,0.8); }

  .carousel-wrap {
    position: relative;
    z-index: 5;
    padding: 52px 0 16px;
    overflow: hidden;
  }

  .carousel-track {
    display: flex;
    align-items: center;
    gap: 16px;
    will-change: transform;
    transition: transform 0.5s cubic-bezier(0.25,0.1,0.25,1);
    cursor: grab;
    user-select: none;
    padding: 30px 0;
  }

  .card-slot {
    flex: 0 0 auto;
    transition: transform 0.5s cubic-bezier(0.25,0.1,0.25,1), opacity 0.5s;
    perspective: 900px;
  }

  .card-slot.center { transform: scale(1.32); opacity: 1; z-index: 10; }
  .card-slot.side-1 { transform: scale(0.82); opacity: 0.55; }
  .card-slot.side-2 { transform: scale(0.66); opacity: 0.3; }
  .card-slot.side-3 { transform: scale(0.54); opacity: 0.12; }

  .card-inner {
    width: 128px;
    height: 180px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
    border-radius: 11px;
    cursor: pointer;
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 11px;
    backface-visibility: hidden;
    overflow: hidden;
    border: 0.5px solid rgba(255,255,255,0.1);
  }

  .card-back {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    gap: 6px;
  }

  .card-sky { position: absolute; inset: 0; }

  .card-silhouette {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 78px;
    height: 108px;
  }

  .card-num {
    position: absolute;
    top: 9px;
    left: 11px;
    font-size: 22px;
    font-weight: 500;
    color: rgba(255,255,255,0.15);
    letter-spacing: -0.02em;
  }

  .card-name-front {
    position: absolute;
    bottom: 11px;
    left: 0; right: 0;
    text-align: center;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.7);
  }

  .back-emoji { font-size: 22px; margin-bottom: 2px; }
  .back-name { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.88); letter-spacing: 0.04em; text-align: center; }
  .back-stat { font-size: 9px; color: rgba(255,255,255,0.38); letter-spacing: 0.04em; text-align: center; line-height: 1.6; }

  .info-panel {
    position: relative;
    z-index: 5;
    max-width: 380px;
    margin: 24px auto 0;
    text-align: center;
    padding: 0 20px 10px;
    min-height: 80px;
  }

  .info-name { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: -0.01em; margin-bottom: 6px; }
  .info-desc { font-size: 13px; color: rgba(255,255,255,0.36); letter-spacing: 0.02em; line-height: 1.65; }

  .flip-hint { font-size: 11px; color: rgba(255,255,255,0.16); letter-spacing: 0.08em; text-align: center; margin: 12px 0 4px; position: relative; z-index: 5; }

  .nav-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding: 16px 0 22px;
    position: relative;
    z-index: 5;
  }

  .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.14); cursor: pointer; transition: all 0.3s; }
  .dot.active { background: rgba(255,255,255,0.65); width: 15px; border-radius: 3px; }

  .footer-line {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 14px 20px 22px;
    border-top: 0.5px solid rgba(255,255,255,0.05);
    font-size: 11px;
    color: rgba(255,255,255,0.14);
    letter-spacing: 0.07em;
  }
</style>

<div class="site-frame">
  <div class="sky-bg"><div class="stars" id="stars"></div></div>

  <nav class="nav">
    <div class="nav-logo">Collection Card</div>
    <ul class="nav-links">
      <li><a href="#">カード一覧</a></li>
      <li><a href="#">アーティスト</a></li>
      <li><a href="#">このサイトについて</a></li>
    </ul>
  </nav>

  <div class="carousel-wrap">
    <div class="carousel-track" id="carousel"></div>
  </div>

  <p class="flip-hint">クリックして裏面を見る</p>

  <div class="info-panel">
    <p class="info-name" id="infoName"></p>
    <p class="info-desc" id="infoDesc"></p>
  </div>

  <div class="nav-dots" id="navDots"></div>
  <div class="footer-line">airele fan card project</div>
</div>

<script>
const players = [
  { num:"01", name:"サンプル 1", desc:"サンプルサンプルサンプルサンプルサンプル", emoji:"🌊" },
  { num:"02", name:"サンプル 2", desc:"サンプルサンプルサンプルサンプルサンプル", emoji:"⚡" },
  { num:"03", name:"サンプル 3", desc:"サンプルサンプルサンプルサンプルサンプル", emoji:"✨" },
  { num:"04", name:"サンプル 4", desc:"サンプルサンプルサンプルサンプルサンプル", emoji:"🌙" },
  { num:"05", name:"サンプル 5", desc:"サンプルサンプルサンプルサンプルサンプル", emoji:"☁️" },
  { num:"06", name:"サンプル 6", desc:"サンプルサンプルサンプルサンプルサンプル", emoji:"🌅" },
  { num:"07", name:"サンプル 7", desc:"サンプルサンプルサンプルサンプルサンプル", emoji:"🌟" },
];

const GRADIENTS = [
  ["#1b3060","#0a1020"],["#1e2455","#0c1030"],["#0f2840","#061520"],
  ["#1f1845","#0c0a25"],["#0d2e38","#061822"],["#1c1050","#0a0820"],["#1a3035","#0a1820"],
];

let current = 3;
const flipped = new Set();

const carousel = document.getElementById("carousel");
const navDots = document.getElementById("navDots");
const infoName = document.getElementById("infoName");
const infoDesc = document.getElementById("infoDesc");

function buildStars() {
  const c = document.getElementById("stars");
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const sz = Math.random() > 0.88 ? 2.5 : 1.5;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*65}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    c.appendChild(s);
  }
}

const silSVG = (idx) => idx % 2 === 0
  ? `<svg viewBox="0 0 80 110" fill="none" xmlns="http://www.w3.org/2000/svg" class="card-silhouette"><ellipse cx="40" cy="17" rx="9" ry="9" fill="rgba(255,255,255,0.17)"/><path d="M29 33 Q40 27 51 33 L55 68 L43 66 L40 88 L37 66 L25 68 Z" fill="rgba(255,255,255,0.14)"/><path d="M29 33 L17 58 L25 61 L31 44" fill="rgba(255,255,255,0.11)"/><path d="M51 33 L63 58 L55 61 L49 44" fill="rgba(255,255,255,0.11)"/><path d="M37 88 L34 110 L39 110 L40 94" fill="rgba(255,255,255,0.12)"/><path d="M43 88 L46 110 L41 110 L40 94" fill="rgba(255,255,255,0.12)"/></svg>`
  : `<svg viewBox="0 0 80 110" fill="none" xmlns="http://www.w3.org/2000/svg" class="card-silhouette"><ellipse cx="40" cy="17" rx="9" ry="9" fill="rgba(255,255,255,0.17)"/><path d="M31 31 Q40 25 49 31 L53 64 L41 62 L40 86 L39 62 L27 64 Z" fill="rgba(255,255,255,0.14)"/><path d="M31 31 L14 54 L22 57 L30 41" fill="rgba(255,255,255,0.11)"/><path d="M49 31 L66 54 L58 57 L50 41" fill="rgba(255,255,255,0.11)"/><path d="M39 86 L36 110 L40 110" fill="rgba(255,255,255,0.12)"/><path d="M41 86 L44 110 L40 110" fill="rgba(255,255,255,0.12)"/></svg>`;

function buildCard(p, idx) {
  const slot = document.createElement("div");
  slot.className = "card-slot";
  const [c1, c2] = GRADIENTS[idx % GRADIENTS.length];

  slot.innerHTML = `
    <div class="card-inner" id="ci-${idx}">
      <div class="card-face">
        <div class="card-sky" style="background:linear-gradient(155deg,${c1} 0%,${c2} 100%)"></div>
        ${silSVG(idx)}
        <div class="card-num">${p.num}</div>
        <div class="card-name-front">${p.name}</div>
      </div>
      <div class="card-face card-back" style="background:linear-gradient(160deg,#141e38 0%,#0a1020 100%)">
        <div class="back-emoji">${p.emoji}</div>
        <div class="back-name">${p.name}</div>
        <div class="back-stat">${p.desc}</div>
      </div>
    </div>`;

  slot.querySelector(".card-inner").addEventListener("click", () => {
    if (!slot.classList.contains("center")) {
      navigateTo(idx);
    } else {
      const ci = document.getElementById(`ci-${idx}`);
      if (flipped.has(idx)) { flipped.delete(idx); ci.classList.remove("flipped"); }
      else { flipped.add(idx); ci.classList.add("flipped"); }
    }
  });
  return slot;
}

function buildDots() {
  navDots.innerHTML = "";
  players.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot" + (i === current ? " active" : "");
    d.addEventListener("click", () => navigateTo(i));
    navDots.appendChild(d);
  });
}

function getClass(i) {
  const d = Math.abs(i - current);
  return d === 0 ? "center" : d === 1 ? "side-1" : d === 2 ? "side-2" : "side-3";
}

function adjustTranslate() {
  const W = carousel.parentElement.offsetWidth;
  const cw = 128 + 16;
  const offset = W / 2 - current * cw - cw / 2;
  carousel.style.transform = `translateX(${offset}px)`;
}

function render() {
  carousel.querySelectorAll(".card-slot").forEach((s, i) => {
    s.className = "card-slot " + getClass(i);
  });
  adjustTranslate();
  const p = players[current];
  infoName.textContent = p.name;
  infoDesc.textContent = p.desc;
  buildDots();
}

function navigateTo(idx) { current = idx; render(); }

function init() {
  buildStars();
  players.forEach((p, i) => carousel.appendChild(buildCard(p, i)));
  carousel.style.cssText = "display:flex;align-items:center;padding:30px 0;";
  current = 3;
  render();

  let sx = 0, drag = false;
  carousel.addEventListener("mousedown", e => { sx = e.clientX; drag = true; });
  window.addEventListener("mousemove", e => {
    if (!drag) return;
    if (Math.abs(e.clientX - sx) > 36) {
      if (e.clientX < sx && current < players.length - 1) navigateTo(current + 1);
      if (e.clientX > sx && current > 0) navigateTo(current - 1);
      drag = false;
    }
  });
  window.addEventListener("mouseup", () => drag = false);
  window.addEventListener("resize", adjustTranslate);
}

init();
</script>
