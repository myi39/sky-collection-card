<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window._three = { THREE, GLTFLoader, OrbitControls };
window.dispatchEvent(new Event('three-ready'));
</script>

<style>
  @font-face {
    font-family: 'Papyrus';
    src: url('fonts/PAPYRUS.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* 表画像の比率に固定（1226:1750 → 縦/横 = 1.4274）。
       高さ予算(56vh)は幅側に変換して効かせ、アスペクトを常に一定に保つ
       （ビューポート高さ＝ブラウザ差で比率が変わるのを防ぐ）。 */
    --card-ar: 1.4274;
    --card-w: min(clamp(240px, 78vw, 340px), calc(56vh / 1.4274));
    --card-h: calc(var(--card-w) * 1.4274);
  }

  html, body {
    background: #080810;
    min-height: 100%;
  }

  .site-frame {
    width: 100%;
    min-height: 100dvh;
    background: #080810;
    border-radius: var(--border-radius-lg);
    overflow: hidden;
    position: relative;
    color: #fff;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  .sky-bg { position: absolute; inset: 0; background: #080810; overflow: hidden; }
  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:0.3} 50%{opacity:0.9} }

  .nav {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 0.5px solid rgba(255,255,255,0.07);
  }

  .nav-logo {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.5);
  }


  .carousel-wrap {
    position: relative;
    z-index: 5;
    padding: 0;
    overflow: hidden;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .carousel-track {
    display: flex;
    align-items: center;
    gap: 16px;
    will-change: transform;
    transition: transform 0.5s cubic-bezier(0.25,0.1,0.25,1);
    cursor: grab;
    user-select: none;
    padding: 30px 0;
    width: 100%;
  }

  .card-slot {
    flex: 0 0 auto;
    transition: transform 0.5s cubic-bezier(0.25,0.1,0.25,1), opacity 0.5s;
    /* カード幅(240〜340px)の約2倍。900px だと投影がほぼ正射影になり、単発の半回転では
       回転方向の手がかりが消えて逆回転に見えることがある（回転する影絵と同じ錯視）。 */
    perspective: 640px;
  }

  .card-slot.center { transform: scale(1.0); opacity: 1; z-index: 10; }
  .card-slot.side-1 { transform: scale(0.88); opacity: 0.7; }
  .card-slot.side-2 { transform: scale(0.75); opacity: 0.3; }
  .card-slot.side-3 { transform: scale(0.60); opacity: 0.08; }

  .card-inner {
    width: var(--card-w);
    height: var(--card-h);
    position: relative;
    transform-style: preserve-3d;
    border-radius: 11px;
    cursor: pointer;
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 11px;
    backface-visibility: hidden;
    overflow: hidden;
  }

  .card-back {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    gap: 6px;
  }

  .card-sky { position: absolute; inset: 0; }

  .card-front-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;        /* 表：全体表示（フルサイズ・切り取りなし） */
  }
  /* 裏：高さを基準に満たし、横は中央で見切れる（表と同じ枠サイズ） */
  .card-back .card-front-img {
    object-fit: cover;
    object-position: center;
  }

  .card-silhouette {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: calc(var(--card-w) * 0.61);
    height: calc(var(--card-h) * 0.6);
  }

  .card-num {
    position: absolute;
    top: 9px;
    left: 11px;
    font-size: 22px;
    font-weight: 500;
    color: rgba(255,255,255,0.15);
    letter-spacing: -0.02em;
  }

  .card-name-front {
    position: absolute;
    bottom: 11px;
    left: 0; right: 0;
    text-align: center;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.7);
  }

  .back-emoji { font-size: 22px; margin-bottom: 2px; }
  .back-name { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.88); letter-spacing: 0.04em; text-align: center; }
  .back-stat { font-size: 9px; color: rgba(255,255,255,0.38); letter-spacing: 0.04em; text-align: center; line-height: 1.6; }

  .info-panel {
    position: relative;
    z-index: 5;
    max-width: 380px;
    margin: 14px auto 0;
    text-align: center;
    padding: 0 20px 10px;
    min-height: 80px;
  }

  /* word-spacing は半角スペースの幅だけを広げる（letter-spacing と違い文字間には効かない）。
     "No.1 Mob" の番号と名前を離すのが目的。全角スペースを使わないのは、Papyrus に U+3000 が
     無く端末のCJKフォントへフォールバックして幅が env ごとにばらつくため。 */
  .info-name { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: -0.01em; word-spacing: 0.4em; margin-bottom: 6px; font-family: Papyrus, fantasy; }
  .info-desc { font-size: 13px; color: rgba(255,255,255,0.36); letter-spacing: 0.02em; line-height: 1.65; font-family: Papyrus, fantasy; }

  .bgm-btn {
    position: fixed;
    bottom: 18px;
    left: 18px;
    z-index: 200;
    background: rgba(255,255,255,0.05);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 7px;
    color: rgba(255,255,255,0.28);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, opacity 0.3s;
    user-select: none;
  }
  .bgm-btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.55); }

  /* Lucide の volume-2（音あり）/ volume-off（音なし）。
     stroke="currentColor" なので .bgm-btn の color がそのまま効く。
     表示するのは「現在の状態」で、押した後どうなるかではない。 */
  .bgm-btn svg { display: block; width: 16px; height: 16px; }
  .bgm-btn .icon-sound-off { display: none; }
  .bgm-btn.is-muted .icon-sound-on { display: none; }
  .bgm-btn.is-muted .icon-sound-off { display: block; }

  .flip-hint { font-size: 11px; color: rgba(255,255,255,0.16); letter-spacing: 0.08em; text-align: center; margin: 12px 0 4px; position: relative; z-index: 5; }

  /* 窓：はみ出したドットを隠す。幅は JS が --dots-window にセット */
  .nav-dots {
    width: var(--dots-window, 300px);
    max-width: 100%;
    margin: 0 auto;
    overflow: hidden;
    padding: 16px 0 22px;
    position: relative;
    z-index: 5;
    touch-action: none;
  }

  /* トラック：現在カードのドットが窓の中央に来るよう JS が --dots-shift をセット */
  .nav-dots-track {
    display: flex;
    gap: 6px;
    width: max-content;
    transform: translateX(var(--dots-shift, 0px));
    transition: transform 0.3s;
  }
  .nav-dots.scrubbing .nav-dots-track { transition: transform 0.1s linear; } /* なぞり中は追従を速く */

  .dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.14); cursor: pointer; transition: all 0.3s; }
  .dot.active { background: rgba(255,255,255,0.65); width: 15px; border-radius: 3px; }
  @keyframes dot-pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.6); }  /* 弾みの強さ（調整可） */
    100% { transform: scale(1); }
  }
  .dot.pop { animation: dot-pop 120ms ease-out; }  /* 弾みの速さ（調整可） */

  .footer-line {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 14px 20px 22px;
    border-top: 0.5px solid rgba(255,255,255,0.05);
    font-size: 11px;
    color: rgba(255,255,255,0.14);
    letter-spacing: 0.07em;
  }

  @media (max-width: 480px) {
    .nav { padding: 14px 16px; }

    .carousel-wrap { padding: 0; }

    .info-panel { margin: 10px auto 0; }
    .info-name { font-size: 17px; }
    .info-desc { font-size: 12px; }
  }

.carousel-wrap { position: relative; } /* overlay の位置基準に */

.ghost-slot {
  flex: 0 0 auto;
  width: var(--card-w);
  height: var(--card-h);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.5s cubic-bezier(0.25,0.1,0.25,1), opacity 0.5s;
  perspective: 900px;
  cursor: pointer;
}

.ghost-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
.ghost-hint.visible { opacity: 1; }

.hint-label {
  font-size: 13px;
  letter-spacing: 0.14em;
  color: rgba(255, 228, 100, 0.55);
  font-family: serif;
  font-style: italic;
}

.hint-arrow {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255, 215, 80, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255, 222, 90, 0.58);
  font-size: 14px;
  animation: hint-pulse 2.8s ease-in-out infinite;
}

@keyframes hint-pulse {
  0%, 100% { box-shadow: 0 0 5px rgba(255, 200, 60, 0.10); }
  50%       { box-shadow: 0 0 13px rgba(255, 200, 60, 0.24); }
}

@keyframes card-spin {
  0%   { transform: rotateY(0deg); animation-timing-function: linear; }
  85%  { transform: rotateY(918deg); animation-timing-function: ease-out; }
  100% { transform: rotateY(1080deg); }
}


/* ─── Plan B: 3D button above card slot ──────────────── */
.card-slot { position: relative; }
.btn-3d {
  position: absolute;
  top: -26px;
  right: 0;
  z-index: 20;
  background: transparent;
  border: none;
  border-bottom: 0.5px solid rgba(255,255,255,0.25);
  border-radius: 0;
  padding: 2px 2px 3px;
  font-size: 9px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.1em;
  cursor: pointer;
  display: none;
  transition: color 0.2s, border-color 0.2s;
  font-family: inherit;
  white-space: nowrap;
}
.btn-3d:hover { color: rgba(255,255,255,0.85); border-bottom-color: rgba(255,255,255,0.6); }

/* ─── Plan B: modal ──────────────────────────────────── */
#modal-3d {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(4,4,16,0.96);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#modal-3d.open { display: flex; }
#modal-3d-wrap {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  border-radius: 11px;
  overflow: hidden;
  border: 0.5px solid rgba(255,255,255,0.12);
}
#modal-3d-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}
#modal-3d-canvas {
  position: relative;
  width: 100%;
  height: 100%;
  display: block;
}
#modal-3d-reset {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 5;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.22);
  color: rgba(255,255,255,0.6);
  font-size: 12px;
  cursor: pointer;
  line-height: 1;
  padding: 0;
  display: none;
}
.modal-3d-name {
  margin-top: 18px;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.1em;
  font-family: Papyrus, fantasy;
}
.modal-3d-close {
  position: absolute;
  top: 20px;
  right: 24px;
  font-size: 22px;
  color: rgba(255,255,255,0.28);
  cursor: pointer;
  background: none;
  border: none;
  line-height: 1;
  padding: 4px;
  transition: color 0.2s;
  font-family: inherit;
}
.modal-3d-close:hover { color: rgba(255,255,255,0.7); }
@keyframes planAResetAppear {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}
.planA-reset-show {
  animation: planAResetAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  pointer-events: auto !important;
}

/* ─── ローディング画面 ─────────────────────────────────── */
/* z-index: .bgm-btn=200 / #modal-3d=300 なので、オーバーレイは 500、
   ローディング中だけ前面に出すボタンは 600 を使う。
   入口の扉 #sound-gate は、そのすべての上に出すため 700。 */
#loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: #080810;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
  transition: opacity 0.6s ease;
}
#loading-overlay.done { opacity: 0; pointer-events: none; }

/* 静止画を既定で見せ、実際に再生が始まってから動画へ切り替える。
   iOS は自動再生がブロックされると再生ボタンを描き、CSS では隠せない
   （WebKit Bug 219889, RESOLVED WONTFIX）。「再生できなければ隠す」だと
   JS が気づくまでの一瞬ボタンが見えるため、「始まるまで出さない」にしている。 */
#loading-media {
  position: relative;
  width: 100%;
  max-width: 700px;
}
#loading-video,
#loading-still {
  display: block;
  width: 100%;
  height: auto;
  mix-blend-mode: screen;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#loading-video { opacity: 0; }
#loading-still { position: absolute; inset: 0; height: 100%; opacity: 1; }
#loading-media.playing #loading-video { opacity: 1; }
#loading-media.playing #loading-still { opacity: 0; }

/* ローディング中だけ音ボタンをオーバーレイより前面へ（Task 5 で付与）。
   平常時の 200 は変えない（3Dモーダル 300 の背後に隠れる既存挙動を保つため）。 */
.bgm-btn.over-loading { z-index: 600; }

/* 本編の隠蔽は opacity で行う。display:none にすると
   adjustTranslate() が参照する offsetWidth が 0 になり中央位置が壊れる。
   .site-frame に transform を付けないこと（内側の #modal-3d が position:fixed のため）。 */
.site-frame {
  opacity: 0;
  transition: opacity 0.6s ease;
}
.site-frame.revealed { opacity: 1; }

.carousel-wrap {
  transform: scale(1.04);
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.carousel-wrap.revealed { transform: scale(1); }

/* ─── 音の扉（入口）───────────────────────────────────── */
/* ローディング(500)・ローディング中のボタン(600)より上の 700。
   背景色は #loading-overlay と同一にして、OK後の暗転に継ぎ目を作らない。 */
#sound-gate {
  position: fixed;
  inset: 0;
  z-index: 700;
  background: #080810;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 24px;
  text-align: center;
  opacity: 1;
  transition: opacity 0.4s ease;
  /* Papyrus は日本語グリフを持たないため扉には使えない。
     指定しないとフォールバック任せになるので、システムUIを明示する。 */
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
               "Noto Sans JP", "Yu Gothic", sans-serif;
}
#sound-gate.done { opacity: 0; pointer-events: none; }

/* 主文で事実を伝え、操作の説明は一回り小さく淡く下に置く。 */
#sound-gate-title {
  font-size: 15px;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.08em;
  line-height: 1.8;
}
#sound-gate-note {
  margin-top: 14px;
  font-size: 11px;
  color: rgba(255,255,255,0.32);
  letter-spacing: 0.08em;
  line-height: 1.8;
}

/* .bgm-btn と同じ質感を一回り大きくしたもの。 */
#sound-gate-ok {
  margin-top: 32px;
  background: rgba(255,255,255,0.05);
  border: 0.5px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 10px 40px;
  color: rgba(255,255,255,0.6);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.16em;
  cursor: pointer;
  transition: background 0.3s, color 0.3s;
}
#sound-gate-ok:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); }
#sound-gate-ok:focus-visible { outline: 1px solid rgba(255,255,255,0.5); outline-offset: 3px; }

/* 扉の表示中は背後をスクロールさせない（Task 2 の OK で除去する）。 */
html.gate-open, html.gate-open body { overflow: hidden; }
</style>

<!-- 蒼穹_soft.mp3 は原本を -12dB したもの（原本 bgm/蒼穹.mp3 は保持）。
     iOS Safari は volume の指定を無視するため、コード側で音量を絞っても効かない。
     素材そのものを下げるのが全環境で効く唯一の方法。生成コマンド:
     ffmpeg -i "bgm/蒼穹.mp3" -af "volume=-12dB" -c:a libmp3lame -b:a 128k "bgm/蒼穹_soft.mp3" -->

// .site-frame は opacity:0 で隠れており入場手段が他に無いため、
// ここに到達できないと画面が永久に真っ黒になる。
// 通常経路の最悪ケース = LOADING_ASSET_WAIT_MS(2000) + LOADING_MAX_MS(60000)
// + 拍のピーク待ち(最大 BEAT_PERIOD=3500) = 65500ms。
// これより後に発火しないとフェイルセーフが正常経路を追い越してしまうため 70000。

// 起動は扉の OK 後（armLoadingFailsafe の呼び出し）。ページ読込から数えると、
// 扉を開いたまま放置した人の裏で本編が現れ、扉を閉じたら既に一覧、という壊れ方をする。
const LOADING_FAILSAFE_MS = 70000;
function armLoadingFailsafe() {
  setTimeout(() => {
    document.querySelector('.site-frame')?.classList.add('revealed');
    document.querySelector('.carousel-wrap')?.classList.add('revealed');
    document.getElementById('loading-overlay')?.remove();
  }, LOADING_FAILSAFE_MS);
}

// 演出前に見せる枚数（= No.30 のインデックス）。ゴーストスロットもこの位置に立つ。
const LOCKED_FROM = 29;

// 3D ビューの背景画像（全カード共通）
const CARD_3D_BG = 'images/3d_background/light.jpg';

// ファイル名は mac 由来の NFD(分解)形 Unicode で保存されているため、
// 参照パスを NFD に正規化してファイル名と一致させる（濁点「ブ」=「フ+゛」等）
ALL_PLAYERS.forEach(p => {
  p.frontImg = p.frontImg.normalize('NFD');
  if (p.frontHiImg) p.frontHiImg = p.frontHiImg.normalize('NFD');
  if (p.backImg)    p.backImg    = p.backImg.normalize('NFD');
  if (p.modelSrc)   p.modelSrc   = p.modelSrc.normalize('NFD');
});

// 「今、一覧に並んでいる」カード。演出が終わると revealLockedCards() が残りを push する。
const players = ALL_PLAYERS.slice(0, LOCKED_FROM);

const GRADIENTS = [
  ["#1b3060","#0a1020"],["#1e2455","#0c1030"],["#0f2840","#061520"],
  ["#1f1845","#0c0a25"],["#0d2e38","#061822"],["#1c1050","#0a0820"],["#1a3035","#0a1820"],
];

let current = 3;
const SPECIAL_IDX = LOCKED_FROM;    // ゴーストスロットのインデックス（演出後は No.30 の位置）
let revealing  = false;             // reveal アニメーション実行中フラグ
let revealDone = false;             // reveal 完了フラグ
const flipped = new Set();
let modalInteractionBlock = false;
let motionActive = false;   // スクラブ/フリック中 = true（この間は画像を読み込まない）

const carousel = document.getElementById("carousel");
const navDots = document.getElementById("navDots");
let pendingPop = false; // 次の buildDots で active ドットを弾ませる

// ─── Nav-dots の窓（現在カードを常に中央に置き、ドット列の方をスライドさせる）───
const DOTS_WINDOW_MAX = 300; // 窓の最大幅(px)。絞るほど現在位置に寄った見え方になる
const DOTS_SIDE_PAD   = 24;  // 画面の左右に最低限残す余白(px)
const DOT_PITCH       = 11;  // ドット5px + gap6px
const DOT_ACTIVE_HALF = 7.5; // active ドット(幅15px)の半分

const navDotsTrack = document.createElement("div");
navDotsTrack.className = "nav-dots-track";
navDots.appendChild(navDotsTrack);

// 現在カードのドット中心が窓の中央に来るようトラックをずらす。
// i 番目のドットの中心は、手前の i 個が 11px ピッチで並ぶので 11i + 7.5。
function updateDotsShift() {
  const shift = navDots.clientWidth / 2 - (DOT_PITCH * current + DOT_ACTIVE_HALF);
  navDots.style.setProperty("--dots-shift", shift + "px");
}

function applyDotsWindow() {
  const w = Math.min(DOTS_WINDOW_MAX, window.innerWidth - DOTS_SIDE_PAD * 2);
  navDots.style.setProperty("--dots-window", Math.max(0, w) + "px");
  updateDotsShift();
}

const infoName = document.getElementById("infoName");
const infoDesc = document.getElementById("infoDesc");

function buildStars() {
  const c = document.getElementById("stars");
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const sz = Math.random() > 0.88 ? 2.5 : 1.5;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*65}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    c.appendChild(s);
  }
}

const silSVG = (idx) => idx % 2 === 0
  ? `<svg viewBox="0 0 80 110" fill="none" xmlns="http://www.w3.org/2000/svg" class="card-silhouette"><ellipse cx="40" cy="17" rx="9" ry="9" fill="rgba(255,255,255,0.17)"/><path d="M29 33 Q40 27 51 33 L55 68 L43 66 L40 88 L37 66 L25 68 Z" fill="rgba(255,255,255,0.14)"/><path d="M29 33 L17 58 L25 61 L31 44" fill="rgba(255,255,255,0.11)"/><path d="M51 33 L63 58 L55 61 L49 44" fill="rgba(255,255,255,0.11)"/><path d="M37 88 L34 110 L39 110 L40 94" fill="rgba(255,255,255,0.12)"/><path d="M43 88 L46 110 L41 110 L40 94" fill="rgba(255,255,255,0.12)"/></svg>`
  : `<svg viewBox="0 0 80 110" fill="none" xmlns="http://www.w3.org/2000/svg" class="card-silhouette"><ellipse cx="40" cy="17" rx="9" ry="9" fill="rgba(255,255,255,0.17)"/><path d="M31 31 Q40 25 49 31 L53 64 L41 62 L40 86 L39 62 L27 64 Z" fill="rgba(255,255,255,0.14)"/><path d="M31 31 L14 54 L22 57 L30 41" fill="rgba(255,255,255,0.11)"/><path d="M49 31 L66 54 L58 57 L50 41" fill="rgba(255,255,255,0.11)"/><path d="M39 86 L36 110 L40 110" fill="rgba(255,255,255,0.12)"/><path d="M41 86 L44 110 L40 110" fill="rgba(255,255,255,0.12)"/></svg>`;

// 中央カードで使う高画質版のパス。buildCard と prefetchPaths の両方が参照するので、
// 導出をここ1箇所にまとめる（片方だけ直してズレるのを防ぐ）。
// frontImg は NFD 正規化済みで、置換するのは ASCII 部分だけなので正規化は保たれる。
function frontHiSrc(p) {
  return p.frontHiImg || p.frontImg.replace('card_front/', 'card_front_hi/');
}

function buildCard(p, idx) {
  const slot = document.createElement("div");
  slot.className = "card-slot";
  const [c1, c2] = GRADIENTS[idx % GRADIENTS.length];

  // 裏画像を持たないカード（告知など）は裏面ごと作らない = めくれない
  const canFlip = !!p.backImg;
  const hiSrc = frontHiSrc(p);

  // modelSrc を持たないカード（3Dデータが無い）はボタンごと作らない
  slot.innerHTML = `
    ${p.modelSrc ? `<button class="btn-3d" data-idx="${idx}">3D で見る ›</button>` : ``}
    <div class="card-inner" id="ci-${idx}">
      <div class="card-face">
        <img data-src="${p.frontImg}" data-hi-src="${hiSrc}" class="card-front-img" alt="${p.name}" draggable="false" decoding="async">
      </div>
      ${canFlip ? `<div class="card-face card-back" style="padding:0">
        <img data-back-src="${p.backImg}" data-back-lo-src="${p.backImg.replace('card_back/','card_back_lo/')}" class="card-front-img" alt="${p.name}" draggable="false" decoding="async">
      </div>` : ``}
    </div>`;

  slot.querySelector(".card-inner").addEventListener("click", () => {
    if (modalInteractionBlock || document.getElementById('modal-3d').classList.contains('open')) return;
    if (didDrag || didTouchDrag || touchHandled) return;
    if (!slot.classList.contains("center")) {
      navigateTo(idx);
    } else if (canFlip) {
      doFlip(idx);
    }
  });
  slot.querySelector(".btn-3d")?.addEventListener("click", e => {
    e.stopPropagation();
    openModal3d(idx);
  });
  return slot;
}

function buildDots() {
  // players は演出後に37枚へ伸びるので、そのまま枚数として使える。
  const needed = (current === SPECIAL_IDX && !revealDone) ? 0 : players.length;

  // 動作中で個数が変わらなければ、再生成せず active クラスだけ移す（DOM churn 回避）
  if (motionActive && navDotsTrack.children.length === needed && needed > 0) {
    for (let i = 0; i < needed; i++) {
      navDotsTrack.children[i].classList.toggle("active", i === current);
    }
    updateDotsShift();
    return;
  }

  navDotsTrack.innerHTML = "";
  if (needed === 0) return; // reveal前はdots非表示
  for (let i = 0; i < needed; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i === current ? " active" : "");
    if (i === current && pendingPop) d.classList.add("pop");
    navDotsTrack.appendChild(d);
  }
  pendingPop = false;
  updateDotsShift();
}

function getClass(i) {
  const d = Math.abs(i - current);
  return d === 0 ? "center" : d === 1 ? "side-1" : d === 2 ? "side-2" : "side-3";
}

// カード1枚の等倍レイアウト幅（小数）を返す。
// offsetWidth は整数に丸められ、× current で後ろのカードほど累積ズレを生む。
// getComputedStyle は scale(transform) の影響を受けず小数px を返すのでズレが出ない。
function cardInnerWidth() {
  const cardEl = carousel.querySelector(".card-inner");
  if (!cardEl) return 240;
  return parseFloat(getComputedStyle(cardEl).width) || 240;
}

function adjustTranslate() {
  const W = carousel.parentElement.offsetWidth;
  const cardW = cardInnerWidth();
  const gap = 16;
  const cw = cardW + gap;
  const offset = W / 2 - current * cw - cardW / 2;
  carousel.style.transform = `translateX(${offset}px)`;
}

const cardDeg = {};
let didDrag = false, didTouchDrag = false, touchHandled = false;
let carouselDragActive = false;
let carouselDragPending = false;

function isUIElement(el) {
  return !!el.closest('nav, .footer-line, button, select, a, .nav-dots');
}
let liveOffset = 0, rafId = null;

// フリップの所要時間。裏画像の解放タイマーもこれを基準に決める。
const FLIP_MS = 1000;
// 回転中のカード（スロット index）。回転が終わるまで次のタップを受け付けない。
const flipping = new Set();

// 回転の終了処理。transitionend を待つのは、固定タイマーで切ると transition の
// 開始が次のスタイル反映まで遅れる分だけ末尾が削られ、減速の余韻がスナップで
// 消えるため。transitionend が来ない場合（タブ非表示など）に備えて保険の
// タイマーも張り、どちらか早いほうで1回だけ後始末する。
function endFlip(ci, idx) {
  let timer = 0;
  const finish = () => {
    ci.removeEventListener('transitionend', onEnd);
    clearTimeout(timer);
    ci.style.transition = "";
    flipping.delete(idx);
  };
  const onEnd = e => { if (e.target === ci && e.propertyName === 'transform') finish(); };
  ci.addEventListener('transitionend', onEnd);
  timer = setTimeout(finish, FLIP_MS + 120);
}

function doFlip(idx) {
  const ci = document.getElementById(`ci-${idx}`);
  if (!ci) return;
  const backImg = ci.querySelector('.card-back img[data-back-src]');
  // 裏面を持たないカード（告知など）は回さない。呼び出し口が click と touchend の
  // 2つあるため、入口ごとに弾くのではなくここで一括して止める。
  if (!backImg) return;
  // 回転中の再タップは無視する（キューにも積まない）。受け付けると回転が
  // 積み上がって止まらなくなるうえ、前回の後始末が新しい回転を途中で切る。
  if (flipping.has(idx)) return;
  const d = cardDeg[idx] || 0;
  const toBack = !flipped.has(idx);
  const base = Math.floor(d / 360) * 360;
  let target;
  if (toBack) {
    // 裏画像は重いのでフリップ時に読み込む（アニメ中にデコードが間に合う）
    if (backImg && backImg.getAttribute('src') !== backImg.dataset.backSrc) {
      backImg.src = backImg.dataset.backSrc;
    }
    // 次の ≡180(mod360) の位置（半回転のみ）
    target = (base + 180 > d ? base + 180 : base + 540);
    flipped.add(idx);
  } else {
    // 次の ≡0(mod360) の位置（半回転のみ）
    target = base + 360;
    flipped.delete(idx);
    // 表に戻したらメモリ節約のため裏画像を解放（アニメ完了後）。
    // ただし中央カードはフルを保持し続ける（再フリップを即・黒なしにするため）。
    if (backImg) setTimeout(() => { if (!flipped.has(idx) && idx !== current) backImg.removeAttribute('src'); }, FLIP_MS + 50);
  }
  cardDeg[idx] = target;
  // 重みのある反転：半回転を 1 秒。easeInOutCubic 級に両端を緩めると最初と最後の
  // 250ms で 6% しか動かず、動いて見える時間が実質 0.5 秒になって体感が短くなる。
  // ここは中盤への集中を弱め、1秒を通して動き続けるイージングにしている。
  flipping.add(idx);
  ci.style.transition = `transform ${FLIP_MS}ms cubic-bezier(0.45, 0.05, 0.35, 1)`;
  ci.style.transform = `rotateY(${target}deg)`;
  endFlip(ci, idx);
}

function getBaseOffset(idx) {
  const W = carousel.parentElement.offsetWidth;
  const cardW = cardInnerWidth();
  return W / 2 - idx * (cardW + 16) - cardW / 2;
}

// 一覧の右端インデックス。演出前は末尾のゴーストスロット、演出後は &You。
// 演出でスロット数が増えるので、DOM の実数から取る。
function maxIndex() {
  return carousel.children.length - 1;
}

function nearestCard(offset) {
  const W = carousel.parentElement.offsetWidth;
  const cardW = cardInnerWidth();
  const cw = cardW + 16;
  return Math.max(0, Math.min(maxIndex(), Math.round((W / 2 - cardW / 2 - offset) / cw)));
}

function cancelInertia() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  motionActive = false;
}

function updateHighlight(offset) {
  const nearest = nearestCard(offset);
  if (nearest !== current) {
    current = nearest;
    carousel.querySelectorAll(".card-slot").forEach((s, i) => {
      s.className = "card-slot " + getClass(i);
    });
    applyCardVisibility();
    if (current === SPECIAL_IDX && !revealDone) triggerReveal();
  }
}

function startInertia(velPxPerMs) {
  cancelInertia();
  motionActive = true;        // 慣性スクロール中：画像読み込みを止める
  carousel.style.transition = "none";
  let vel = velPxPerMs * 16; // px/ms → px/frame (60fps)
  let offset = liveOffset;
  const minOff = getBaseOffset(maxIndex());
  const maxOff = getBaseOffset(0);

  function frame() {
    vel *= 0.93; // 摩擦
    offset += vel;
    if (offset > maxOff) { offset = maxOff; vel = 0; }
    if (offset < minOff) { offset = minOff; vel = 0; }
    carousel.style.transform = `translateX(${offset}px)`;
    liveOffset = offset;
    updateHighlight(offset);
    if (Math.abs(vel) < 0.5) {
      const target = nearestCard(offset);
      current = target;
      carousel.style.transition = "transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1)";
      motionActive = false;     // 停止：ウィンドウ内の画像をまとめて読み込む
      render();
      loadNearImages();
      return;
    }
    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);
}

// 表画像は全カードを軽量解像度(480px)で常駐デコードする（仮想化なし）。
// → スクラブ中のデコードが起きず、どこでも即表示になる。
// 裏画像は重い(769px)ため、フリップ時のみ読み込む（doFlip 参照）。
// onComplete: 全枚数の読み込みが済んだ時点で1回だけ呼ばれる（ローディングの完了判定用）。
function loadAllFronts(onComplete) {
  const imgs = carousel.querySelectorAll('img[data-src]'); // 表画像のみ
  let i = 0;
  const pending = [];
  function step() {
    const t0 = performance.now();
    while (i < imgs.length && performance.now() - t0 < 6) { // 1フレーム最大6msだけ読む
      const img = imgs[i++];
      if (img.getAttribute('src') !== img.dataset.src) img.src = img.dataset.src;
      // init() → applyCenterHiRes() が先に全カードの src を入れているため、
      // 「ここで src を入れた画像だけ待つ」形にすると実質1枚しか待てない。
      // 完了判定は load/error で行う — decode() は display:none 配下の
      // ゴーストカードで即 reject し、ネットワークを待たずに完了扱いになるため。
      pending.push(new Promise(r => {
        if (img.complete) { r(); return; }
        img.addEventListener('load', r, { once: true });
        img.addEventListener('error', r, { once: true });
      }));
      if (img.decode) img.decode().catch(() => {}); // RAMへ先行デコード（visibility切替時に即描画）
    }
    if (i < imgs.length) requestAnimationFrame(step);
    else if (onComplete) Promise.all(pending).then(() => onComplete());
  }
  requestAnimationFrame(step);
}

// ─── 裏画像＋伏せカードの表画像の先読み（HTTPキャッシュに入れるだけ）───────────────
// img.src には載せない。載せるとデコード済みビットマップが常駐し、
// 裏フル(769px)37枚だけで 769*1077*4*37 ≒ 122MB になってモバイルが落ちる。
// ここで潰すのはネットワーク待ちだけ。デコードは従来どおりフリップ時に行い、
// アニメ(1000ms)の間に間に合う。メモリ管理は updateCenterBack() のまま変更しない。
const PREFETCH_CONCURRENCY = 6;     // 一斉に投げるとブラウザの同時接続上限で表画像まで遅延する
const PREFETCH_TIMEOUT_MS  = 60000; // 極端に遅い回線で永久に明けないのを防ぐ

function prefetchPaths() {
  const paths = [];
  const addBack = full => {
    paths.push(full);
    paths.push(full.replace('card_back/', 'card_back_lo/'));
  };
  ALL_PLAYERS.forEach(p => { if (p.backImg) addBack(p.backImg); }); // 読み込み時に NFD 正規化済み
  // 伏せられた10枚は init 時点で DOM に無く、loadAllFronts の対象外になる。
  // 表画像もここでキャッシュに入れておき、演出明けに白抜けしないようにする。
  ALL_PLAYERS.slice(LOCKED_FROM).forEach(p => paths.push(p.frontImg));
  // 演出明けに中央へ残るのは No.30（= ALL_PLAYERS[LOCKED_FROM]）の1枚だけ。
  // 中央カードだけは applyCenterHiRes() が高画質版に差し替えるため、この1枚に限り
  // 高画質版もキャッシュに入れておき、差し替えでネットワーク待ちが出ないようにする。
  // 残りの伏せカードは端に並ぶだけで高画質版を使わないので、ここでは足さない。
  const special = ALL_PLAYERS[LOCKED_FROM];
  if (special) paths.push(frontHiSrc(special));
  return paths;
}

function prefetchCardImages() {
  const queue = prefetchPaths();
  const total = queue.length;
  let done = 0;

  return new Promise(resolve => {
    let settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(done);
    };
    const timer = setTimeout(finish, PREFETCH_TIMEOUT_MS);
    if (total === 0) { finish(); return; }

    function pump() {
      const url = queue.shift();
      if (url === undefined) return;
      fetch(url, { cache: 'force-cache' })
        // 本文を読み切る。読み手がいないとブラウザが転送を打ち切り、
        // キャッシュに入り切らないことがある（＝先読みが無意味になる）。
        // arrayBuffer は圧縮されたままの生バイト(約69KB)で、画像のデコードは起きない。
        .then(r => r.arrayBuffer())
        .catch(() => {}) // 個別の失敗は無視。その1枚だけ従来どおりフリップ時に取得されるだけ
        .then(() => {
          if (++done >= total) finish();
          else pump();
        });
    }
    for (let i = 0; i < PREFETCH_CONCURRENCY; i++) pump();
  });
}

// 表画像は常駐するので、移動時の画像管理は不要（呼び出し箇所互換のための空関数）
function updateCardImages() {}
function loadNearImages() {}

// GPU合成の負荷を抑える — 画面に映る範囲(±VISIBLE_WINDOW)だけ描画し、
// 遠いカードは visibility:hidden でGPUコンポジットから外す。
// 画像のデコード済みデータはRAMに残るため、近づけば再デコードなしで即描画される。
const VISIBLE_WINDOW = 2;
function applyCardVisibility() {
  const slots = carousel.children; // card-slot ×N + ghost-slot
  for (let i = 0; i < slots.length; i++) {
    slots[i].style.visibility =
      (Math.abs(i - current) <= VISIBLE_WINDOW) ? "visible" : "hidden";
  }
}

// 高画質で描くのは常に中央1枚だけ。停止時のみ中央を高画質へ、他は480pxへ戻す。
// （スクラブ/フリック中は重い高画質を読み込まない＝クラッシュ防止）
function applyCenterHiRes() {
  if (motionActive) return;
  const slots = carousel.children;
  for (let i = 0; i < slots.length; i++) {
    const img = slots[i].querySelector('img[data-src]'); // 表imgのみ（裏は data-back-src）
    if (!img) continue;
    if (i === current && img.dataset.hiSrc) {
      if (img.getAttribute('src') !== img.dataset.hiSrc) img.src = img.dataset.hiSrc;
    } else {
      if (img.getAttribute('src') !== img.dataset.src) img.src = img.dataset.src;
    }
  }
  updateCenterBack();
}

// 裏画像のメモリ管理（停止時に applyCenterHiRes から呼ぶ）。
//  - 中央カード      : フル(769px)を先読み＆保持 → フリップが即・黒なし
//  - 非中央でフリップ中: 低画質(300px)へ落としてフルをメモリ解放（表示は枠サイズ一致のまま）
//  - 非中央で表向き   : src を破棄して完全解放
function updateCenterBack() {
  const slots = carousel.children;
  for (let i = 0; i < slots.length; i++) {
    const img = slots[i].querySelector('.card-back img[data-back-src]');
    if (!img) continue;
    const full = img.dataset.backSrc;
    const lo = img.dataset.backLoSrc;
    if (i === current) {
      if (img.getAttribute('src') !== full) {
        img.src = full;
        if (img.decode) img.decode().catch(() => {});
      }
    } else if (flipped.has(i)) {
      if (lo && img.getAttribute('src') !== lo) img.src = lo;
    } else {
      if (img.hasAttribute('src')) img.removeAttribute('src');
    }
  }
}

function render() {
  carousel.querySelectorAll(".card-slot").forEach((s, i) => {
    s.className = "card-slot " + getClass(i);
  });
  applyCardVisibility();
  applyCenterHiRes();
  adjustTranslate();

  // ゴーストスロットのスケール/透明度
  const gs = document.getElementById("ghost-slot");
  if (gs) {
    const d = Math.abs(SPECIAL_IDX - current);
    const scl = d === 0 ? 1.0 : d === 1 ? 0.88 : d === 2 ? 0.75 : 0.60;
    const opc = d === 0 ? 1   : d === 1 ? 0.7  : d === 2 ? 0.3  : 0.08;
    gs.style.transform = `scale(${scl})`;
    gs.style.opacity   = String(opc);
  }

  // ゴーストヒント — 最後のカードまたはゴーストスロット上で表示
  const hint = document.getElementById("ghost-hint");
  if (hint && !revealDone) {
    if (current >= players.length - 1) hint.classList.add("visible");
    else hint.classList.remove("visible");
  }

  if (current < players.length) {
    const p = players[current];
    infoName.textContent = p.name;
    infoDesc.textContent = p.desc;
  } else {
    infoName.textContent = "";
    infoDesc.textContent = "";
  }
  buildDots();
}

function navigateTo(idx) {
  if (idx === current) return;       // 同じカードなら何もしない
  if (!motionActive) {               // タップ移動のときだけ弾み＋振動
    pendingPop = true;
    if (navigator.vibrate) navigator.vibrate(10); // Android のみ反応・iOS は無視
  }
  current = idx;
  render();
}

// ─── Nav-dots スクラブ ───────────────────────────────────
// 押した位置を中心に不感帯を置き、内側と外側で操作の意味を変える。
//   不感帯の内側 … 指の位置どおりに動く（狙った1枚で止められる）
//   不感帯の外側 … 指を止めていても送り続ける。はみ出した距離が速度になる
// ドラッグを画面端で保持すると一覧がスクロールし続ける、あの挙動と同じ。
const SCRUB_DEADZONE  = 60; // 直接操作でいられる範囲（押した位置からのpx）
const SCRUB_DIRECT_PX = 16; // 直接操作の感度（この px 動かすと1枚進む）
const SCRUB_RAMP      = 100; // 不感帯を出てからこの px で最高速に達する
const SCRUB_SPEED_MIN = 2;  // 自動送りの下限速度（枚/秒）
const SCRUB_SPEED_MAX = 16; // 自動送りの上限速度（枚/秒）

let scrubbing = false;
let scrubAnchorX = 0;    // 押した位置。不感帯はここを中心に固定される
let scrubAnchorIdx = 0;  // 直接操作の基準カード。自動送りを抜けるたび取り直す
let scrubPos = 0;        // 小数の現在位置（自動送りはここに速度を積む）
let scrubLastX = 0;
let scrubAuto = false;
let scrubMaxIdx = 0;
let scrubRaf = null, scrubPrevTs = 0;

function cacheScrubGeometry() {
  scrubMaxIdx = navDotsTrack.children.length - 1;
}

// 押した瞬間だけは、指の真下にあるドットへジャンプする（従来のタップ移動）。
// active ドットだけ幅が広く間隔が不均一なので、中心座標の最近傍で判定する。
function nearestDotIndex(clientX) {
  const dots = navDotsTrack.children;
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < dots.length; i++) {
    const r = dots[i].getBoundingClientRect();
    const dist = Math.abs(clientX - (r.left + r.width / 2));
    if (dist < bestDist) { bestDist = dist; best = i; }
  }
  return best;
}

// 指が止まっていても自動送りを進める必要があるので、なぞっている間ずっと回す。
function scrubFrame(ts) {
  if (!scrubbing) { scrubRaf = null; return; }
  const dt = scrubPrevTs ? Math.min(0.05, (ts - scrubPrevTs) / 1000) : 0; // 復帰直後の飛びを抑える
  scrubPrevTs = ts;

  const delta = scrubLastX - scrubAnchorX;
  const over  = Math.abs(delta) - SCRUB_DEADZONE;

  if (over > 0) {
    scrubAuto = true;
    const ratio = Math.min(1, over / SCRUB_RAMP);
    const speed = SCRUB_SPEED_MIN + (SCRUB_SPEED_MAX - SCRUB_SPEED_MIN) * ratio;
    scrubPos += Math.sign(delta) * speed * dt;
  } else {
    // 自動送りから戻ってきた瞬間に基準を取り直す。
    // これをしないと、送った分を無視して押した位置の近くへ引き戻される。
    if (scrubAuto) {
      scrubAuto = false;
      scrubAnchorIdx = scrubPos - delta / SCRUB_DIRECT_PX;
    }
    scrubPos = scrubAnchorIdx + delta / SCRUB_DIRECT_PX;
  }

  scrubPos = Math.max(0, Math.min(scrubMaxIdx, scrubPos)); // 端で速度を溜め込ませない
  navigateTo(Math.round(scrubPos));
  scrubRaf = requestAnimationFrame(scrubFrame);
}

navDots.addEventListener('pointerdown', e => {
  if (current === SPECIAL_IDX && !revealDone) return; // reveal前はドット無し
  if (!navDotsTrack.children.length) return;
  e.preventDefault();
  e.stopPropagation();
  scrubbing = true;
  motionActive = true;              // 動作中：画像読み込みを止める
  navDots.classList.add('scrubbing');
  navDots.setPointerCapture(e.pointerId);
  cacheScrubGeometry();
  scrubAnchorX = scrubLastX = e.clientX;
  scrubAnchorIdx = scrubPos = nearestDotIndex(e.clientX);
  scrubAuto = false;
  scrubPrevTs = 0;
  navigateTo(Math.round(scrubPos)); // タップした点へジャンプ
  if (scrubRaf === null) scrubRaf = requestAnimationFrame(scrubFrame);
});

navDots.addEventListener('pointermove', e => {
  if (!scrubbing) return;
  e.preventDefault();
  scrubLastX = e.clientX;           // 実際の移動は scrubFrame が処理する
});

function endScrub(e) {
  if (!scrubbing) return;
  scrubbing = false;
  navDots.classList.remove('scrubbing');
  if (scrubRaf !== null) { cancelAnimationFrame(scrubRaf); scrubRaf = null; }
  motionActive = false;             // 停止：ウィンドウ内の画像をまとめて読み込む
  loadNearImages();
  applyCenterHiRes();               // 停止した中央カードを高画質化
  try { navDots.releasePointerCapture(e.pointerId); } catch (_) {}
}
navDots.addEventListener('pointerup', endScrub);
navDots.addEventListener('pointercancel', endScrub);

window.addEventListener('resize', applyDotsWindow);
applyDotsWindow();

// 演出明けに、伏せていた10枚（No.30〜36・&You・告知2枚）を一覧へ加える。
// ゴーストスロットはそのまま No.30 のカードに置き換わるので、
// current（= SPECIAL_IDX）は動かさずに No.30 が中央へ残る。
function revealLockedCards() {
  const locked = ALL_PLAYERS.slice(LOCKED_FROM);
  players.push(...locked);

  const ghost = document.getElementById("ghost-slot");
  const first = buildCard(locked[0], LOCKED_FROM);

  // No.30 は演出直後に中央へ残る唯一のカード。buildCard は src を空で作るので、
  // このあと render() → applyCenterHiRes() が高画質版を入れるまで絵が無い状態になり、
  // カルーセルのフェードイン(0.8s)と重なって「一度消えて読み直す」ように見えていた。
  // 先読み済みの軽量版を先に入れておけば即座に描画され、以降の高画質への差し替えでは
  // img が既存の絵を保持したまま切り替わる（HTML仕様: pending request が揃うまで
  // current request を描き続ける）ため、白抜けが起きない。
  const firstImg = first.querySelector('img[data-src]');
  if (firstImg) firstImg.src = firstImg.dataset.src;

  if (ghost) ghost.replaceWith(first); // ゴーストは「and...」の器なので、まるごと置き換える
  else carousel.appendChild(first);

  for (let i = 1; i < locked.length; i++) {
    carousel.appendChild(buildCard(locked[i], LOCKED_FROM + i));
  }
  showCardButtons(); // 追加したカードの .btn-3d にも現在の表示状態を反映する
}

// Phase 3 の内訳。合計 2700ms で、分割前の静止 1200ms より 1.5秒 長い。
// その分 Phase 4（カルーセル復帰）以降が後ろにずれ、演出全体も 1.5秒 延びる。
const SETTLE_HOLD_MS = 1200;  // 着地したカードを見せる静止
const SETTLE_MOVE_MS = 1000;  // カルーセル定位置へ寄せる時間
const SETTLE_BEAT_MS = 500;   // 到着してからクロスフェード開始までの間

// Phase 3b でカードを寄せる距離。オーバーレイは .carousel-wrap 全体に敷かれて
// いるのでカードはその中央に着地するが、カルーセルのカードは info-panel と
// nav-dots の分（実測で約68px、480px以下では約66px）だけ上にいる。
// 値を直書きするとブレークポイントや将来のレイアウト変更で再びずれるため、
// 毎回 #ghost-slot を測って差分を取る。
//
// #ghost-slot は演出中の中央スロットで、高さはカードと同一（--card-h）。
// Phase 4 の revealLockedCards() で No.30 に置き換わるので、それより前にしか
// 測れない点に注意。render() が scale() を掛けることがあるが、transform-origin は
// 既定の中心なので「中心のY」はスケールの影響を受けない。
// carousel は opacity:0 だが getBoundingClientRect() は opacity に影響されない。
// .carousel-wrap の scale はローディング完了時に 1 に戻っており（.revealed）、
// 演出はそれより後にしか起きないため、画面px＝translateYのpxとして扱ってよい。
function carouselOffsetY(overlayEl) {
  const ghost = document.getElementById("ghost-slot");
  if (!ghost) return 0;
  const g = ghost.getBoundingClientRect();
  const o = overlayEl.getBoundingClientRect();
  if (!g.height || !o.height) return 0;
  return (g.top + g.height / 2) - (o.top + o.height / 2);
}

function triggerReveal() {
  if (revealing || revealDone) return;
  revealing = true;
  cancelInertia();

  const infoPanelEl  = document.querySelector(".info-panel");
  const flipHintEl   = document.querySelector(".flip-hint");
  const overlay      = document.getElementById("special-card-overlay");
  const fall         = document.getElementById("special-card-fall");
  const drop         = document.getElementById("special-card-drop");

  // ─── Phase 1: コンテンツをフェードアウト（1.0s） ───
  [carousel, infoPanelEl, navDots, flipHintEl].forEach(el => {
    if (!el) return;
    el.style.transition = "opacity 1s ease";
    el.style.opacity    = "0";
  });

  setTimeout(() => {
    // ─── Phase 2: オーバーレイ表示・暗転（1s 待機） ───
    overlay.style.display = "flex";
    fall.getBoundingClientRect(); // force layout for offsetHeight
    const startY = -(overlay.offsetHeight / 2 + (drop.offsetHeight || 180) / 2 + 2);
    fall.style.transition = "none";
    fall.style.transform  = `translateY(${startY}px)`;
    drop.style.animation  = "none";
    drop.style.transform  = "rotateY(0deg)";
    fall.getBoundingClientRect(); // reflow

    setTimeout(() => {
      // ─── Phase 2b: 落下 + 回転アニメーション ───
      fall.style.transition = "transform 6s linear";
      fall.style.transform  = "translateY(0px)";
      drop.style.transform  = "";
      drop.style.animation  = "card-spin 8s forwards";

      setTimeout(() => {
        // ─── Phase 3: 静止（1.2s） ───

        setTimeout(() => {
          // ─── Phase 3b: カルーセルの定位置へ寄せる（1.0s） ───
          // ここで詰めておかないと、Phase 4 のクロスフェードで
          // 約68px ぶんカードが飛んで見える。
          fall.style.transition = `transform ${SETTLE_MOVE_MS}ms cubic-bezier(0.22, 1, 0.36, 1)`;
          fall.style.transform  = `translateY(${carouselOffsetY(overlay)}px)`;

          setTimeout(() => {
            // ─── Phase 4: カルーセル復帰（0.8s） ───
            revealDone = true;

            // ゴーストスロットを No.30 に置き換え、31〜36 と &You を右に足す
            revealLockedCards();

            // オーバーレイをフェードアウト
            overlay.style.transition = "opacity 0.6s ease";
            overlay.style.opacity    = "0";

            // カルーセルをぼんやり復帰
            carousel.style.visibility = "visible";
            [carousel, infoPanelEl, navDots, flipHintEl].forEach(el => {
              if (!el) return;
              el.style.transition = "opacity 0.8s ease";
              el.style.opacity    = "1";
            });

            render(); // 39個に増えたdot・info-panel・追加カードの画像読み込みを反映

            setTimeout(() => {
              overlay.style.display  = "none";
              overlay.style.opacity  = "1"; // 次回用にリセット
              fall.style.transition  = "none";
              fall.style.transform   = `translateY(${startY}px)`;
              drop.style.animation   = "none";
              drop.style.transform   = "rotateY(0deg)";
              revealing = false;
            }, 800);

          }, SETTLE_MOVE_MS + SETTLE_BEAT_MS); // Phase 3b: 移動 → 間
        }, SETTLE_HOLD_MS);                    // Phase 3: 静止
      }, 8000);                                // Phase 2b
    }, 1000);     // 暗転待機
  }, 100);        // Phase 1
}

function init() {
  buildStars();
  players.forEach((p, i) => carousel.appendChild(buildCard(p, i)));
  carousel.style.cssText = "display:flex;align-items:center;padding:30px 0;";

  const ghostSlot = document.createElement("div");
  ghostSlot.className = "ghost-slot";
  ghostSlot.id = "ghost-slot";
  // 演出前の「and...」の置き場。演出が終わると revealLockedCards() が
  // このスロットごと No.30 の本物のカードに差し替える。
  ghostSlot.innerHTML = `
  <div class="ghost-hint" id="ghost-hint">
    <span class="hint-label">and...</span>
    <div class="hint-arrow">
      <!-- 以前は文字の ▶(U+25B6) だった。フォントにグリフが無い環境で絵文字フォントへ
           フォールバックしてカラー絵文字になるため SVG に置き換えた。
           viewBox は三角形の外接矩形に合わせてあるので、width/height の値が
           そのまま画面上の三角形のピクセル寸法になる（大きさの調整はこの2つだけ）。 -->
      <svg xmlns="http://www.w3.org/2000/svg" width="12" height="15" viewBox="8 5 11 14" aria-hidden="true">
        <path d="M8 5v14l11-7z" fill="currentColor"/>
      </svg>
    </div>
  </div>`;
  carousel.appendChild(ghostSlot);

  current = 0;
  render();

  // マウスドラッグ（リアルタイム追従 + 慣性）
  let sx = 0, stime = 0, drag = false, baseOff = 0;
  document.addEventListener("mousedown", e => {
    if (isUIElement(e.target)) return;
    if (document.getElementById('modal-3d').classList.contains('open')) return;
    cancelInertia();
    drag = true; didDrag = false;
    sx = e.clientX; stime = Date.now();
    baseOff = liveOffset = getBaseOffset(current);
    carousel.style.transition = "none";
  });
  window.addEventListener("mousemove", e => {
    if (!drag) return;
    if (Math.abs(e.clientX - sx) > 5) didDrag = true;
    liveOffset = baseOff + e.clientX - sx;
    carousel.style.transform = `translateX(${liveOffset}px)`;
  });
  window.addEventListener("mouseup", e => {
    if (!drag) return;
    drag = false;
    startInertia((e.clientX - sx) / Math.max(1, Date.now() - stime));
  });

  // タッチスワイプ（リアルタイム追従 + 慣性 + 方向ロック）
  let tx = 0, ty = 0, ttime = 0, tbaseOff = 0;
  document.addEventListener("touchstart", e => {
    if (isUIElement(e.target)) return;
    if (document.getElementById('modal-3d').classList.contains('open')) return;
    carouselDragPending = true;
    carouselDragActive = false;
    cancelInertia();
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; ttime = Date.now();
    tbaseOff = liveOffset = getBaseOffset(current);
    didTouchDrag = false;
    carousel.style.transition = "none";
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!carouselDragPending && !carouselDragActive) return;
    const cx = e.touches[0].clientX;
    const cy = e.touches[0].clientY;
    const dx = Math.abs(cx - tx);
    const dy = Math.abs(cy - ty);
    if (carouselDragPending && (dx > 5 || dy > 5)) {
      carouselDragPending = false;
      if (dx >= dy) carouselDragActive = true;
    }
    if (!carouselDragActive) return;
    e.preventDefault();
    if (dx > 8) didTouchDrag = true;
    liveOffset = tbaseOff + cx - tx;
    carousel.style.transform = `translateX(${liveOffset}px)`;
  }, { passive: false });
  document.addEventListener("touchend", e => {
    const wasPending = carouselDragPending;
    const wasActive = carouselDragActive;
    carouselDragPending = false;
    carouselDragActive = false;
    if (!wasActive && !wasPending) return;
    if (modalInteractionBlock || document.getElementById('modal-3d').classList.contains('open')) return;
    if (e.target.closest('.btn-3d')) return;
    const endX = e.changedTouches[0].clientX;
    const dt = Date.now() - ttime;
    // タップ判定：移動なし & 短時間
    if (!didTouchDrag && dt < 250) {
      touchHandled = true;
      setTimeout(() => { touchHandled = false; }, 400);
      const cardSlot = e.target.closest(".card-slot");
      if (cardSlot) {
        const slots = [...carousel.querySelectorAll(".card-slot")];
        const idx = slots.indexOf(cardSlot);
        if (idx >= 0) {
          carousel.style.transition = "";
          if (cardSlot.classList.contains("center")) doFlip(idx);
          else navigateTo(idx);
          return;
        }
      }
    }
    startInertia((endX - tx) / Math.max(1, dt));
  }, { passive: true });

  window.addEventListener("resize", adjustTranslate);
}

// init() はローディング画面のアセット確保後（loadingScreenReady() の解決後）に呼ぶ。
// 下のローディング制御ブロックを参照。

// ─── 音（ローディング中は心音、入場後は BGM。左下の同じボタンで操作する）───
// 初期は OFF。autoplay 制限により、無音でなければ自動再生できないため。
// 反応するのはこのボタン1箇所だけ。画面のどこを触っても音は鳴らない。
const loadingVideo = document.getElementById('loading-video');
const soundBtn = document.getElementById('bgmBtn');
const bgm = document.getElementById('bgm');
const HEART_VOL = 1.0;
// 素材(蒼穹_soft.mp3)の時点で -12dB 済みなので、ここでは減衰させない。
// 1.0 にしてあるのは、iOS が volume を無視することで生じる
// 「PCでは 0.28、iPhone では 1.0」という食い違いを無くすため。
// これで PC で聴いた音量がそのまま iPhone の音量になる。
// 音量を変えたいときは、この値ではなく mp3 を作り直すこと（iOS に効かないため）。
const BGM_VOL   = 1.0;
const HEART_FADE_OUT_MS  = 600;  // 入場時に心音を落としきるまで
const BGM_START_DELAY_MS = 1000; // revealSite() 起点。心音600ms + 完全な静けさ400ms
let soundOn = false;
let bgmPrimePromise = null; // 解錠処理。二重に走らせない
let bgmStarted = false;     // 一度でも聞こえる形で鳴らしたか（Task 4 の頭出し判定で使う）
let loadingDone = false; // Task 6 の revealSite() が true にする

// 同じ要素に対して新しいフェードが始まったら、古いフェードは次のフレームで降りる。
// これが無いと、ボタン連打で複数のループが同時に el.volume を書き合い、
// 音量がばたついたり、OFF にしたのに下がりきらないまま一瞬鳴ったりする。
function fadeAudio(el, from, to, ms) {
  const gen = el._fadeGen = (el._fadeGen || 0) + 1;
  const t0 = performance.now();
  el.volume = from;
  function tick(ts) {
    if (el._fadeGen !== gen) return; // 自分より新しいフェードが始まっている
    const k = Math.min(1, (ts - t0) / ms);
    el.volume = from + (to - from) * k;
    if (k < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ユーザー操作の中で一度 play() しておくと autoplay ロックが解ける。
// preload="none" でも play() で読み込みが始まる。
//
// 【変更点】以前は再生しっぱなしにしていたため、本編に着く頃には蒼穹が
// 数秒〜数十秒進んでいた。ここでは解錠だけして即 pause() し、
// 実際に鳴らすのは startBgm()（Task 4）に任せる。
// play() 直後の pause() は AbortError を投げる環境があるので握り潰す。
function primeBgm() {
  if (bgmPrimePromise) return bgmPrimePromise;
  bgm.volume = 0;
  bgmPrimePromise = bgm.play().then(() => bgm.pause()).catch(() => {});
  return bgmPrimePromise;
}

// 蒼穹を鳴らし始める。初めて聞こえる形で鳴らすときだけ曲の頭に巻き戻す。
// 2回目以降のオン／オフは止まった位置から再開する（途中で消してまた点けたときに
// 頭へ戻るのは不自然なため）。
// 解錠(primeBgm)の pause() と play() が競合しないよう、解錠の完了を待ってから鳴らす。
function startBgm(fadeMs) {
  Promise.resolve(primeBgm()).then(() => {
    if (!soundOn) return; // 解錠の完了待ちの間にミュートされていたら鳴らさない
    if (!bgmStarted) {
      bgmStarted = true;
      try { bgm.currentTime = 0; } catch (e) {}
      bgm.volume = 0;
    }
    bgm.muted = false;
    bgm.play().catch(() => {});
    fadeAudio(bgm, bgm.volume, BGM_VOL, fadeMs);
  });
}

// 入場時。心音を完全に落としきり、静けさを挟んでから蒼穹を始める。
// 以前は両者を同時に走らせるクロスフェードで、約600ms 重なっていた。
function handoffToBgm() {
  fadeAudio(loadingVideo, loadingVideo.volume, 0, HEART_FADE_OUT_MS);
  // 静けさの1秒はユーザーがボタンに触れるのに十分な長さがあるため、
  // その間に明示的にミュートされていたら、待機中のタイマーで上書きしない。
  setTimeout(() => { if (soundOn) startBgm(1200); }, BGM_START_DELAY_MS);
}

// ボタンには「現在の状態」を出す（押した後どうなるか、ではない）。
// aria-label だけは動作を書く。Task 5 でアイコン版に差し替える。
function updateSoundBtn() {
  soundBtn.classList.toggle('is-muted', !soundOn); // 表示するのは現在の状態
  soundBtn.setAttribute('aria-label', soundOn ? '音を消す' : '音を出す');
}

function setSound(on) {
  soundOn = on;
  updateSoundBtn();

  // 受け渡し中（心音のフェードアウトが終わる前）に触られても心音を残さない。
  // volume ではなく muted なのは即座に効くため（iOS では volume が無視される）。
  if (loadingDone) loadingVideo.muted = true;

  if (on) {
    if (loadingDone) {
      startBgm(800); // 初回なら頭出しされる（bgmStarted の判定は startBgm 内）
    } else {
      loadingVideo.muted = false;
      fadeAudio(loadingVideo, 0, HEART_VOL, 800); // いきなり最大音量にしない
    }
  } else {
    if (loadingDone) {
      fadeAudio(bgm, bgm.volume, 0, 300);
      // iOS は volume を無視するため、フェードだけでは止まらない。
      // 心音側と同じく muted で確実に黙らせる（フェード完了後に掛ける）。
      setTimeout(() => { if (!soundOn) bgm.muted = true; }, 320);
    } else {
      fadeAudio(loadingVideo, loadingVideo.volume, 0, 300);
      setTimeout(() => { if (!soundOn) loadingVideo.muted = true; }, 320);
    }
  }
}

updateSoundBtn(); // 初期は OFF。扉の OK（enterFromGate）で ON になる
soundBtn.classList.add('over-loading'); // ローディング中はオーバーレイより前面
soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  setSound(!soundOn);
});

// ─── 扉の OK から呼ばれる。すべてユーザー操作の文脈の中で同期的に実行する ───
// ここに await や setTimeout を挟むと、iOS で解錠に失敗する。
function enterFromGate() {
  soundOn = true;
  updateSoundBtn();

  // 蒼穹は「解錠だけ」して止めておく。鳴らすのは本編に着いてから。
  primeBgm();

  // 心音を先頭の拍から鳴らし直す。currentTime=0 により、最初のピークが
  // 1.5秒後に来ることが保証される（msToNextBeatPeak の前提と一致する）。
  try { loadingVideo.currentTime = 0; } catch (e) {}
  loadingVideo.muted = false;
  loadingVideo.volume = 0;
  // 低電力モード等で autoplay が失敗していても、ユーザー操作起点のここで通る。
  // iOS が自動再生を拒否したときに描く再生ボタン（WebKit Bug 219889）も、
  // この経路なら現れない。
  loadingVideo.play().catch(() => {});
  fadeAudio(loadingVideo, 0, HEART_VOL, 800); // いきなり最大音量にしない
}

// ─── ローディング制御 ───────────────────────────────────
// 最低表示時間・表画像のデコード・裏画像の先読み がすべて済んだ後、
// 次に来る心音の拍の頂点で本編へ移る。入場のタップは無い。
const LOADING_MIN_MS   = 3000;  // 最低表示時間（目安。実効の最短は次のピークまで待つため約5.0秒）
const LOADING_MAX_MS   = 60000; // 上限。どれか1つでも固まったら諦めて本編へ進む
// BEAT_PERIOD / BEAT_PEAK_OFFSET は movies/heartbeat_loop.mp4 の実測値。
// 生成コマンド: ffmpeg -ss 10.5 -t 17.5 -i movies/心音.mp4 -vf scale=800:-2 ...
// 動画を作り直すと拍がずれるので、切り出し位置を変えたらここも測り直すこと。
const BEAT_PERIOD      = 3.5;   // 心音の周期(秒)
const BEAT_PEAK_OFFSET = 1.5;   // ループ先頭から最初のピークまで(秒)

const loadingOverlay = document.getElementById('loading-overlay');
const siteFrame      = document.querySelector('.site-frame');
const carouselWrap   = document.querySelector('.carousel-wrap');
// autoplay 属性が効かない環境（iOS の低電力モード等）への再試行。
// 失敗しても静止画（#loading-still）が出るため、画面が真っ黒にはならない。
loadingVideo.play().catch(() => {});

// 実際に再生が始まってから動画を出す（それまでは静止画）。
// iOS は自動再生がブロックされると再生ボタンを描き、CSS では隠せない
// （WebKit Bug 219889, RESOLVED WONTFIX）ため、始まるまで動画を出さない設計にしている。
loadingVideo.addEventListener('playing', () => {
  document.getElementById('loading-media').classList.add('playing');
}, { once: true });

// 拍のピークは currentTime が 1.5 + 3.5k 秒の地点。次のピークまでの ms を返す。
function msToNextBeatPeak() {
  const t = loadingVideo.currentTime || 0;
  const phase = (((t - BEAT_PEAK_OFFSET) % BEAT_PERIOD) + BEAT_PERIOD) % BEAT_PERIOD;
  return (phase === 0 ? 0 : BEAT_PERIOD - phase) * 1000;
}

function revealSite() {
  if (loadingDone) return;
  loadingDone = true;

  siteFrame.classList.add('revealed');
  carouselWrap.classList.add('revealed');
  loadingOverlay.classList.add('done');
  soundBtn.classList.remove('over-loading');
  if (soundOn) handoffToBgm();

  setTimeout(() => {
    loadingVideo.pause();
    loadingOverlay.remove();
    carouselWrap.style.transform = 'none'; // 以降 getBoundingClientRect に影響させない
    console.log('[loading] revealed at', Math.round(performance.now() - window.__loadingStartedAt), 'ms');
  }, 700); // CSS の 0.6s トランジションより少し長く
}

// ローディング画面が映ってから重い読み込みを始める。同時に走らせると
// 111件の画像リクエストが動画を後回しにし、遅い回線で
// 「ローディング画面が30秒出てこない」状態になる（実測: 動画38.39s / 静止画32.42s）。
const LOADING_ASSET_WAIT_MS = 2000; // 動画が来ないときの見切り

function loadingScreenReady() {
  return new Promise(r => {
    if (loadingVideo.readyState >= 2) { r(); return; } // HAVE_CURRENT_DATA
    loadingVideo.addEventListener('loadeddata', r, { once: true });
    loadingVideo.addEventListener('error', r, { once: true });
    setTimeout(r, LOADING_ASSET_WAIT_MS); // 動画が来なくても先へ進む
  });
}

// ─── 扉（入口）─────────────────────────────────────────
// OK のタップが、このサイトで唯一の「音の解錠」ジェスチャーになる。
// 扉を出している間も心音動画の先読み（loadingScreenReady）は走らせておく。
// 滞在時間がそのままバッファリングに使われ、OK 後の待ちが短くなる。
const soundGate   = document.getElementById('sound-gate');
const soundGateOk = document.getElementById('sound-gate-ok');

const gateOpened = new Promise(resolve => {
  soundGateOk.addEventListener('click', () => {
    // 【重要】必ずハンドラの先頭で、同期的に呼ぶこと。
    // await や setTimeout を挟んだ後に play() を呼ぶと、
    // iOS でユーザー操作の文脈が切れて解錠に失敗する。
    try { enterFromGate(); } catch (e) {} // 扉から先へ進む経路は何があっても止めない

    window.__gateOpenedAt = performance.now(); // 検証用
    document.documentElement.classList.remove('gate-open');
    soundGate.classList.add('done');
    setTimeout(() => soundGate.remove(), 450); // CSS の 0.4s より少し長く
    armLoadingFailsafe();
    resolve();
  }, { once: true });
});
soundGateOk.focus();

// 心音動画の先読みはページ読込時から走らせる。扉の滞在で先に終わっていれば、
// OK 直後にローディングの本処理へ入れる。
const loadingAssetsReady = loadingScreenReady();

// ネットワークが停滞して画像リクエストが成功も失敗もしないまま止まると、
// loadAllFronts の完了が永久に来ない。スキップ手段を持たない設計なので、
// 全体に上限を掛けておかないとギャラリーへ到達する手段が完全に失われる。
// LOADING_MAX_MS の計測も、この Promise.all が解けた後＝OK 以降に始まる。
Promise.all([gateOpened, loadingAssetsReady]).then(() => {
  window.__loadingStartedAt = performance.now();
  init();
  showCardButtons(); // カード生成後でないと .btn-3d が存在しない（元は末尾で呼ばれていた）
  Promise.race([
    Promise.all([
      new Promise(r => setTimeout(r, LOADING_MIN_MS)),
      new Promise(r => loadAllFronts(r)), // 表画像を全カード分、軽量解像度で読み込む（完了まで待つ）
      prefetchCardImages(),
    ]),
    new Promise(r => setTimeout(r, LOADING_MAX_MS)),
  ]).catch(() => {}).then(() => {
    setTimeout(revealSite, msToNextBeatPeak());
  });
});

// ─── Three.js Lazy Loader ────────────────────────────────────
async function loadThree() {
  if (window._three) return window._three;
  return new Promise(resolve => {
    window.addEventListener('three-ready', () => resolve(window._three), { once: true });
  });
}

// ─── Plan B ──────────────────────────────────────────────────
let modalRenderer = null, modalControls = null, modalAnimId = null, modalScene = null;
let modal_camDist = 0, modal_hasMoved = false, modal_resetTimer = null;

async function openModal3d(idx) {
  closeModal3d();
  // 伏せカードと 3Dデータが無いカードは .btn-3d ごと存在しないので、通常ここは通らない
  const p = players[idx];
  if (!p || !p.modelSrc) return;
  document.getElementById('modal3dName').textContent = p.name;

  // 3D ビューの背景画像（全カード共通）
  const bgImg = document.getElementById('modal-3d-bg');
  bgImg.src = CARD_3D_BG;
  bgImg.style.display = 'block';

  const modal = document.getElementById('modal-3d');
  modal.classList.add('open');

  const { THREE, GLTFLoader, OrbitControls } = await loadThree();
  const canvas = document.getElementById('modal-3d-canvas');

  // キャンバスの表示サイズを取得（CSS で決まる）
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 400;
  const h = rect.height || 400;

  const scene = new THREE.Scene();
  modalScene = scene;
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.01, 1000);

  // 立体みを出しつつ暗くしないため 環境光（底上げ）＋キーライト（陰影）を併用
  // （3d_test.html で確定: ambInt 2.0 / keyInt 2.0 / 環境マップなし）
  scene.add(new THREE.AmbientLight(0xffffff, 2.0));
  const dir = new THREE.DirectionalLight(0xffffff, 2.0);
  dir.position.set(3, 5, 4);
  scene.add(dir);

  modalRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  modalRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  modalRenderer.setSize(w, h);
  modalRenderer.setClearColor(0x000000, 0);

  modalControls = new OrbitControls(camera, canvas);
  modalControls.enableDamping = true;
  modalControls.dampingFactor = 0.06;
  modalControls.enablePan = true;
  modalControls.rotateSpeed = 0.55;   // 上下左右の回転感度（既定1.0→緩める）

  // ── 縦回転のラバーバンド（USDZ 風）──
  // 極角 polar: 0°=真上, 90°=水平, 180°=真下
  const DEG = THREE.MathUtils.degToRad;
  const RB = {
    hardMin: DEG(10),   // これ以上は絶対に行けない（真上の手前）
    softMin: DEG(45),   // 自由ゾーン上端＝ラバー開始＆離したときの戻り先
    softMax: DEG(135),  // 自由ゾーン下端＝ラバー開始＆離したときの戻り先
    hardMax: DEG(170),  // これ以上は絶対に行けない（真下の手前）
    dragK: 0.04,        // ドラッグ中の基本の引き戻し強さ（抵抗感）
    dragRamp: 3.0,      // 侵入が深いほど強くなる係数（端の重さ）
    maxK: 0.45,         // ドラッグ中の引き戻しの上限（壁の硬さ）
    releaseK: 0.10,     // リリース後の戻る速さ（スナップバック）
  };
  // ハード壁は OrbitControls 標準機能で確実に止める
  modalControls.minPolarAngle = RB.hardMin;
  modalControls.maxPolarAngle = RB.hardMax;

  let rbDragging = false;
  modalControls.addEventListener('start', () => { rbDragging = true; });
  modalControls.addEventListener('end',   () => { rbDragging = false; });

  // 指定した極角へカメラを再配置（方位角・距離は維持）
  const _rbOffset = new THREE.Vector3();
  const _rbSph = new THREE.Spherical();
  function rbSetPolar(polar) {
    _rbOffset.copy(camera.position).sub(modalControls.target);
    _rbSph.setFromVector3(_rbOffset);
    _rbSph.phi = polar;
    _rbSph.makeSafe();
    _rbOffset.setFromSpherical(_rbSph);
    camera.position.copy(modalControls.target).add(_rbOffset);
    camera.lookAt(modalControls.target);
  }
  // 毎フレーム：自由ゾーン外なら最寄りのソフト境界へ引き戻す
  //  - ドラッグ中は侵入が深いほど強く（抵抗感）
  //  - リリース後はソフト境界（45°/135°）へスッと戻る
  function rbApply() {
    const p = modalControls.getPolarAngle();
    let target = null, range = 0;
    if (p < RB.softMin)      { target = RB.softMin; range = RB.softMin - RB.hardMin; }
    else if (p > RB.softMax) { target = RB.softMax; range = RB.hardMax - RB.softMax; }
    if (target === null) return;
    let k;
    if (rbDragging) {
      const penetration = Math.min(Math.abs(target - p) / range, 1);
      k = Math.min(RB.dragK * (1 + RB.dragRamp * penetration), RB.maxK);
    } else {
      k = RB.releaseK;
    }
    rbSetPolar(p + (target - p) * k);
  }

  // リセットボタン
  const resetBtn = document.getElementById('modal-3d-reset');
  modal_hasMoved = false;
  modal_resetTimer = null;
  modalControls.addEventListener('start', () => {
    if (modal_hasMoved) return;
    modal_hasMoved = true;
    modal_resetTimer = setTimeout(() => {
      resetBtn.style.display = 'block';
      resetBtn.classList.remove('planA-reset-show');
      void resetBtn.offsetWidth;
      resetBtn.classList.add('planA-reset-show');
    }, 500);
  });
  resetBtn.onclick = () => {
    camera.position.set(0, 0, modal_camDist);
    camera.quaternion.set(0, 0, 0, 1);
    if (modalControls) { modalControls.target.set(0, 0, 0); modalControls.update(); }
    modal_hasMoved = false;
    clearTimeout(modal_resetTimer);
    resetBtn.style.display = 'none';
    resetBtn.classList.remove('planA-reset-show');
  };

  const loader = new GLTFLoader();
  loader.load(p.modelSrc, gltf => {
    // 新モデル（2026/06/21 差し替え）は正面を向いて出力されているため向き補正は不要
    // 立体みを出すため MeshStandardMaterial に統一（rough 0 / metal 0）。
    // 明るさは環境光2.0＋キーライト2.0で底上げし、画像と同等の明るさを保つ。
    gltf.scene.traverse(o => {
      if (!o.isMesh || !o.material) return;
      const src = o.material;
      o.material = new THREE.MeshStandardMaterial({
        map: src.map || null,
        color: src.map ? 0xffffff : (src.color ? src.color.clone() : 0xffffff),
        transparent: src.transparent,
        alphaTest: src.alphaTest,
        side: src.side,
        vertexColors: src.vertexColors,
        roughness: 0,
        metalness: 0,
      });
    });
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    gltf.scene.position.sub(center);
    camera.position.set(0, 0, maxDim * 1.5);
    modal_camDist = maxDim * 1.5;
    modalControls.update();
    scene.add(gltf.scene);
  });

  function animate() {
    modalAnimId = requestAnimationFrame(animate);
    modalControls.update();
    rbApply();
    modalRenderer.render(scene, camera);
  }
  animate();
}

function closeModal3d() {
  document.getElementById('modal-3d').classList.remove('open');
  if (modalAnimId) { cancelAnimationFrame(modalAnimId); modalAnimId = null; }
  // ジオメトリ・テクスチャを破棄してGPUメモリを解放
  if (modalScene) {
    modalScene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
          for (const k in m) { const v = m[k]; if (v && v.isTexture) v.dispose(); }
          m.dispose();
        });
      }
    });
    modalScene = null;
  }
  if (modalControls) { modalControls.dispose(); }
  if (modalRenderer) { modalRenderer.dispose(); modalRenderer = null; }
  modalControls = null;
  const resetBtn = document.getElementById('modal-3d-reset');
  if (resetBtn) { resetBtn.style.display = 'none'; resetBtn.classList.remove('planA-reset-show'); }
  clearTimeout(modal_resetTimer);
  modal_hasMoved = false;
  modalInteractionBlock = true;
  setTimeout(() => { modalInteractionBlock = false; }, 350);
}

// ─── Init (plan-b only) ───────────────────────────────────────
function showCardButtons() {
  document.querySelectorAll('.btn-3d').forEach(btn => {
    btn.style.display = 'block';
  });
}

// Modal close button and backdrop click
document.getElementById('modal3dClose').addEventListener('click', closeModal3d);
document.getElementById('modal-3d').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-3d')) closeModal3d();
});
</script>
