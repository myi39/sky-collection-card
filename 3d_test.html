<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 調整テスト（立体み＋ラバーバンド）</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; padding: 16px; }
  canvas { border-radius: 8px; }
  .stage { display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .stage figure { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .stage figcaption { font-size:12px; color:#888; }
  #ref { height:500px; width:auto; max-width:46vw; border-radius:8px; background:#1a1a2e; }
  @media (max-width:720px){ #ref{ height:auto; width:min(80vw,360px); max-width:none; } }
  #status { font-size: 13px; color: #aaa; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button { background: #2a2a40; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #3a3a55; }
  select { background: #2a2a40; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 7px 10px; font-size: 14px; }
  .hint { font-size: 12px; color: #888; max-width: 520px; text-align: center; }
  #panel { background:#1c1c2e; border:1px solid #333; border-radius:8px; padding:12px 16px; width:min(92vw,520px); display:flex; flex-direction:column; gap:7px; }
  #panel h3 { font-size:13px; color:#9aa; margin:6px 0 2px; font-weight:bold; }
  #panel h3:first-child { margin-top:0; }
  .sld { display:grid; grid-template-columns: 140px 1fr 56px; align-items:center; gap:10px; font-size:12px; }
  .sld label { color:#bbb; }
  .sld input[type=range] { width:100%; accent-color:#5a6cff; }
  .sld .val { color:#5a6cff; font-weight:bold; text-align:right; font-variant-numeric:tabular-nums; }
  #panel .pbtn { align-self:flex-start; margin-top:6px; font-size:12px; padding:5px 12px; }
  #light-toggles { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:4px; }
  #light-toggles label { display:flex; align-items:center; gap:5px; font-size:12px; color:#cdd; cursor:pointer; }
  #light-toggles input { accent-color:#5a6cff; width:15px; height:15px; }
</style>
</head>
<body>
<div class="stage">
  <figure>
    <canvas id="c" width="500" height="500"></canvas>
    <figcaption>3Dモデル（調整対象）</figcaption>
  </figure>
  <figure>
    <img id="ref" alt="カード表画像">
    <figcaption>カード表画像（明るさの基準）</figcaption>
  </figure>
</div>
<div class="row">
  <label>モデル:</label>
  <select id="model"></select>
  <button id="cam">カメラ正面に戻す</button>
</div>
<div id="status">読み込み中...</div>
<div id="polar" style="font-size:13px;color:#5a6cff;font-weight:bold;">極角: --</div>
<p class="hint">立体み（陰影）と明るさをスライダーで調整。暗くならない範囲で立体感が出る値を探してください。<br>
ドラッグで回転（縦はラバーバンド）、ホイールでズーム。</p>

<div id="panel">
  <h3>見た目（立体み・明るさ）</h3>
  <div id="light-toggles"></div>
  <div id="sliders-look"></div>
  <h3>操作（ラバーバンド）</h3>
  <div id="sliders-rb"></div>
  <button class="pbtn" id="dump">現在値をコンソールに出力</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const status = document.getElementById('status');
const canvas = document.getElementById('c');

// ファイル名は mac 由来 NFD 形なので NFD 正規化してから読み込む。
// モデル名と画像名は綴りが違う（例 11_piano.glb ⇄ 11_Piano表.jpg）ので明示的に対応づける。
const MODELS = [
  { label: '11_Piano', model: '3d/11_Piano.glb', img: 'images/card_front/11_Piano_front.jpg' },
  { label: '02_P',     model: '3d/02_P.glb',     img: 'images/card_front/02_P_front.jpg' },
  { label: '01_Mob',  model: '3d/01_Mob.glb',  img: 'images/card_front/01_Mob_front.jpg' },
  { label: '18_Syacho',  model: '3d/18_Syacho.glb',  img: 'images/card_front/18_Syacho_front.jpg' },
].map(o => ({ label: o.label, model: o.model.normalize('NFD'), img: o.img.normalize('NFD') }));

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(500, 500);
renderer.setClearColor(0x1a1a2e);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
const CAM_DIST_DEFAULT = 5;
camera.position.set(0, 0, CAM_DIST_DEFAULT);

// ── 見た目（立体み）設定 ──
// 立体感は出しつつ暗くしないため「環境マップ＋環境光（底上げ）＋キーライト」を併用。
//  - ambient/env : どんな面も最低限明るく保つ（暗さ防止）
//  - directional : 面の向きで明暗を付ける（立体み）
//  - roughness   : 低い=照りで立体感, 高い=マット
const LK = {
  envInt: 1.0,    // 環境マップ強度（柔らかい陰影・写り込み）
  keyInt: 1.2,    // キーライト強度（立体みの主役）
  ambInt: 1.2,    // 環境光＝全体の底上げ（暗さ防止）
  rough:  0.7,    // ラフネス（質感）
  metal:  0.0,    // メタルネス（金属感）
};

// 環境マップ（柔らかい陰影と明るさを足す）
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const ambient = new THREE.AmbientLight(0xffffff, LK.ambInt);
const keyLight = new THREE.DirectionalLight(0xffffff, LK.keyInt);
keyLight.position.set(3, 5, 4);
scene.add(ambient, keyLight);

let modelMats = [];   // 現在モデルのマテリアル（ライブ調整用）
function applyLook() {
  ambient.intensity = LK.ambInt;
  keyLight.intensity = LK.keyInt;
  for (const m of modelMats) {
    if ('roughness' in m)        m.roughness = LK.rough;
    if ('metalness' in m)        m.metalness = LK.metal;
    if ('envMapIntensity' in m)  m.envMapIntensity = LK.envInt;
    m.needsUpdate = true;
  }
}

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.55;   // 上下左右の回転感度（既定1.0→緩める / パネルで調整可）

// ── 縦回転のラバーバンド（USDZ 風）──
// 極角 polar: 0°=真上, 90°=水平, 180°=真下
const DEG = THREE.MathUtils.degToRad;
const RB = {
  hardMin: DEG(10),   // これ以上は絶対に行けない（真上の手前）
  softMin: DEG(45),   // 自由ゾーンの上端＝ラバー開始＆離したときの戻り先
  softMax: DEG(135),  // 自由ゾーンの下端＝ラバー開始＆離したときの戻り先
  hardMax: DEG(170),  // これ以上は絶対に行けない（真下の手前）
  dragK: 0.04,        // ドラッグ中の引き戻し強さ（基本の抵抗感）
  dragRamp: 3.0,      // 侵入が深いほど強くなる係数（端の重さ）
  maxK: 0.45,         // ドラッグ中の引き戻しの上限（壁の硬さ）
  releaseK: 0.10,     // リリース後の戻る速さ（スナップバック）
};
controls.minPolarAngle = RB.hardMin;
controls.maxPolarAngle = RB.hardMax;

let rbDragging = false;
controls.addEventListener('start', () => { rbDragging = true; });
controls.addEventListener('end',   () => { rbDragging = false; });

const _rbOffset = new THREE.Vector3();
const _rbSph = new THREE.Spherical();
function rbSetPolar(polar) {
  _rbOffset.copy(camera.position).sub(controls.target);
  _rbSph.setFromVector3(_rbOffset);
  _rbSph.phi = polar;
  _rbSph.makeSafe();
  _rbOffset.setFromSpherical(_rbSph);
  camera.position.copy(controls.target).add(_rbOffset);
  camera.lookAt(controls.target);
}
function rbApply() {
  const p = controls.getPolarAngle();
  let target = null, range = 0;
  if (p < RB.softMin)      { target = RB.softMin; range = RB.softMin - RB.hardMin; }
  else if (p > RB.softMax) { target = RB.softMax; range = RB.hardMax - RB.softMax; }
  if (target === null) return;
  let k;
  if (rbDragging) {
    const penetration = Math.min(Math.abs(target - p) / range, 1);
    k = Math.min(RB.dragK * (1 + RB.dragRamp * penetration), RB.maxK);
  } else {
    k = RB.releaseK;
  }
  rbSetPolar(p + (target - p) * k);
}

// ── ライブ調整パネル ──
const r2d = r => r * 180 / Math.PI;
function mkSlider(container, label, min, max, step, get, set, fmt) {
  const row = document.createElement('div');
  row.className = 'sld';
  const lab = document.createElement('label'); lab.textContent = label;
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = get();
  const val = document.createElement('span'); val.className = 'val';
  const show = () => { val.textContent = fmt(parseFloat(inp.value)); };
  inp.addEventListener('input', () => { set(parseFloat(inp.value)); show(); });
  show();
  row.append(lab, inp, val);
  container.appendChild(row);
}

// 光源ON/OFFトグル（1つずつ消して各効果を確認できる）
const togEl = document.getElementById('light-toggles');
function mkToggle(label, checked, onChange) {
  const lab = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = checked;
  cb.addEventListener('change', () => onChange(cb.checked));
  const span = document.createElement('span'); span.textContent = label;
  lab.append(cb, span);
  togEl.appendChild(lab);
}
mkToggle('環境光', true,    on => { ambient.visible = on; });
mkToggle('キーライト', true, on => { keyLight.visible = on; });
mkToggle('環境マップ', true, on => { scene.environment = on ? envTex : null; });

// 見た目（立体み）
const lookEl = document.getElementById('sliders-look');
mkSlider(lookEl, '環境光（底上げ）', 0, 3, 0.05,
  () => LK.ambInt, v => { LK.ambInt = v; applyLook(); }, v => v.toFixed(2));
mkSlider(lookEl, 'キーライト（陰影）', 0, 3, 0.05,
  () => LK.keyInt, v => { LK.keyInt = v; applyLook(); }, v => v.toFixed(2));
mkSlider(lookEl, '環境マップ強度', 0, 3, 0.05,
  () => LK.envInt, v => { LK.envInt = v; applyLook(); }, v => v.toFixed(2));
mkSlider(lookEl, 'ラフネス（質感）', 0, 1, 0.02,
  () => LK.rough, v => { LK.rough = v; applyLook(); }, v => v.toFixed(2));
mkSlider(lookEl, 'メタルネス', 0, 1, 0.02,
  () => LK.metal, v => { LK.metal = v; applyLook(); }, v => v.toFixed(2));

// 操作（ラバーバンド）
const rbEl = document.getElementById('sliders-rb');
mkSlider(rbEl, '回転感度', 0.1, 1.0, 0.05,
  () => controls.rotateSpeed, v => { controls.rotateSpeed = v; }, v => v.toFixed(2));
mkSlider(rbEl, 'ソフト境界(°)', 10, 80, 1,
  () => r2d(RB.softMin),
  v => { RB.softMin = DEG(v); RB.softMax = DEG(180 - v); },
  v => v.toFixed(0) + '°');
mkSlider(rbEl, 'ハード壁(°)', 0, 44, 1,
  () => r2d(RB.hardMin),
  v => { RB.hardMin = DEG(v); RB.hardMax = DEG(180 - v);
         controls.minPolarAngle = RB.hardMin; controls.maxPolarAngle = RB.hardMax; },
  v => v.toFixed(0) + '°');
mkSlider(rbEl, '基本の重さ', 0, 0.30, 0.01,
  () => RB.dragK, v => { RB.dragK = v; }, v => v.toFixed(2));
mkSlider(rbEl, '端の重さ', 0, 8, 0.5,
  () => RB.dragRamp, v => { RB.dragRamp = v; }, v => v.toFixed(1));
mkSlider(rbEl, '壁の硬さ上限', 0.10, 1.0, 0.05,
  () => RB.maxK, v => { RB.maxK = v; }, v => v.toFixed(2));
mkSlider(rbEl, '戻る速さ', 0.05, 0.50, 0.01,
  () => RB.releaseK, v => { RB.releaseK = v; }, v => v.toFixed(2));

document.getElementById('dump').onclick = () => {
  const cfg = {
    look: {
      ambInt: +LK.ambInt.toFixed(2),
      keyInt: +LK.keyInt.toFixed(2),
      envInt: +LK.envInt.toFixed(2),
      rough:  +LK.rough.toFixed(2),
      metal:  +LK.metal.toFixed(2),
    },
    rubber: {
      rotateSpeed: +controls.rotateSpeed.toFixed(2),
      softMinDeg: Math.round(r2d(RB.softMin)),
      hardMinDeg: Math.round(r2d(RB.hardMin)),
      dragK: +RB.dragK.toFixed(2),
      dragRamp: +RB.dragRamp.toFixed(1),
      maxK: +RB.maxK.toFixed(2),
      releaseK: +RB.releaseK.toFixed(2),
    },
  };
  console.log('[3D config]', cfg);
  alert('現在値（本番反映に使えます）:\n' + JSON.stringify(cfg, null, 2));
};

const loader = new GLTFLoader();
let current = null;     // 現在のモデル scene
let camDist = CAM_DIST_DEFAULT;

function resetCamera() {
  camera.position.set(0, 0, camDist);
  camera.quaternion.set(0, 0, 0, 1);
  controls.target.set(0, 0, 0);
  controls.update();
}

const refImg = document.getElementById('ref');
function loadModel(entry) {
  if (current) { scene.remove(current); current = null; }
  modelMats = [];
  refImg.src = entry.img;   // 同番号のカード表画像を基準として表示
  status.textContent = '読み込み中...';
  status.style.color = '#aaa';
  loader.load(
    entry.model,
    gltf => {
      current = gltf.scene;
      // 向きは確定済み（補正不要）。中心合わせのみ実施。
      const box = new THREE.Box3().setFromObject(current);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      current.position.sub(center);
      camDist = maxDim * 2.2;
      // 立体み用に MeshStandardMaterial へ統一（テクスチャ色はそのまま）
      current.traverse(o => {
        if (!o.isMesh || !o.material) return;
        const m = o.material;
        const std = new THREE.MeshStandardMaterial({
          map: m.map || null,
          color: m.map ? 0xffffff : (m.color ? m.color.clone() : 0xffffff),
          transparent: m.transparent,
          alphaTest: m.alphaTest,
          side: m.side,
          vertexColors: m.vertexColors,
        });
        o.material = std;
        modelMats.push(std);
      });
      applyLook();
      scene.add(current);
      resetCamera();
      status.textContent = '読み込み成功！ドラッグで回転、ホイールでズーム';
      status.style.color = '#6fcf97';
    },
    xhr => {
      const pct = xhr.total ? Math.round(xhr.loaded / xhr.total * 100) : '?';
      status.textContent = `読み込み中... ${pct}%`;
    },
    err => {
      status.textContent = `エラー: ${err.message}`;
      status.style.color = '#eb5757';
      console.error(err);
    }
  );
}

// ── UI ──
document.getElementById('cam').onclick = resetCamera;

const sel = document.getElementById('model');
MODELS.forEach((m, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = m.label;
  sel.appendChild(opt);
});
sel.onchange = () => loadModel(MODELS[+sel.value]);

loadModel(MODELS[0]);

const polarReadout = document.getElementById('polar');
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  rbApply();
  if (polarReadout) {
    polarReadout.textContent = '極角: ' + (controls.getPolarAngle() * 180 / Math.PI).toFixed(1) + '°';
  }
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
