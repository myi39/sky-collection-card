<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Test</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  canvas { border-radius: 8px; }
  #status { margin-top: 12px; font-size: 13px; color: #aaa; }
</style>
</head>
<body>
<canvas id="c" width="500" height="500"></canvas>
<div id="status">読み込み中...</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const status = document.getElementById('status');
const canvas = document.getElementById('c');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(500, 500);
renderer.setClearColor(0x1a1a2e);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(0, 0, 5);

scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const dir = new THREE.DirectionalLight(0xffffff, 2);
dir.position.set(3, 5, 4);
scene.add(dir);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

const loader = new GLTFLoader();
loader.load(
  '3d/3d_sample_special.glb',
  gltf => {
    gltf.scene.rotation.x = Math.PI / 2;
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    gltf.scene.position.sub(center);
    camera.position.set(0, 0, maxDim * 2.2);
    controls.update();
    scene.add(gltf.scene);
    status.textContent = '読み込み成功！ドラッグで回転、ホイールでズーム';
    status.style.color = '#6fcf97';
  },
  xhr => {
    const pct = xhr.total ? Math.round(xhr.loaded / xhr.total * 100) : '?';
    status.textContent = `読み込み中... ${pct}%`;
  },
  err => {
    status.textContent = `エラー: ${err.message}`;
    status.style.color = '#eb5757';
    console.error(err);
  }
);

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
